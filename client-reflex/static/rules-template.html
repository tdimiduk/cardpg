<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>$title$</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Lora:ital,wght@0,400;0,700;1,400&family=Almendra:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="atomic.css" />
    <style>
      body {
        background-color: var(--color-stone-darkest, #0c0a09);
        color: var(--color-stone-lightest, #f5f5f4);
        font-family: "Lora", serif;
        padding: 2.5rem;
        max-width: 850px;
        margin: 0 auto;
        line-height: 1.6;
      }
      h1,
      h2,
      h3,
      h4 {
        font-family: "Cinzel", serif;
        color: var(--color-gold-bright, #fbbf24);
        margin-top: 2rem;
        margin-bottom: 1rem;
      }
      h1 {
        border-bottom: 2px solid var(--color-gold-muted, #d97706);
        padding-bottom: 0.5rem;
        margin-top: 1rem;
      }
      code {
        background-color: rgba(28, 25, 23, 0.6);
        color: var(--color-gold-bright, #fcd34d);
        padding: 0.2rem 0.4rem;
        border-radius: 4px;
        font-family: monospace;
        font-size: 0.9em;
        border: 1px solid var(--color-stone-med, #44403c);
      }
      pre {
        background-color: var(--color-stone-dark, #1c1917);
        border: 1px solid var(--color-stone-med, #44403c);
        padding: 1rem;
        border-radius: 6px;
        overflow-x: auto;
      }
      pre code {
        border: none;
        background: none;
        padding: 0;
      }
      a {
        color: var(--color-blue-bright, #3b82f6);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
        background-color: rgba(28, 25, 23, 0.4);
        border-radius: 6px;
        overflow: hidden;
      }
      th,
      td {
        border: 1px solid var(--color-stone-med, #44403c);
        padding: 0.75rem;
        text-align: left;
      }
      th {
        background-color: var(--color-stone-dark, #1c1917);
        color: var(--color-gold-bright, #fbbf24);
        font-family: "Cinzel", serif;
      }
      tr:nth-child(even) {
        background-color: rgba(28, 25, 23, 0.2);
      }
    </style>
  </head>
  <body>
    $body$
  </body>
</html>
