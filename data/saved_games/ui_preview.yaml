env:
  consequenceCardTemplates:
    Breached Guard:
      name: Breached Guard
      notes: A severe penalty to defense.
      passive:
        When calculating Defense Strength, treat the highest value card in
        your stack as 0
      rules:
        - "Task: Hammer Out (Check {Red} 8; Time 1 hour; Cost Hammer) → Remove this"
        - "Task: Careful Repair (Check {Yellow} 12; Time 4 hours; Cost Repair Tools)
          → Remove this"
        - When removed → If you used 'Hammer Out', this armor gains the 'Battered' condition
      severity: 2
      tags:
        - Combat
        - Condition
    Compromised Leverage:
      name: Compromised Leverage
      notes: A severe penalty to offense.
      passive:
        When calculating Attack Strength, treat the highest value card in your
        stack as 0
      rules:
        - "Task: Set and Bind Wound (Check {Blue} 10; Time 1 hour) → Remove this"
        - When removed → Add 2 Wounds to your expended pile
      severity: 2
      tags:
        - Combat
        - Condition
    Major Trauma:
      effects:
        - Expend 4 cards from hand and replace them with Injury cards. For each card
          you cannot expend, put the Injury on top of your deck instead.
      name: Major Trauma
      notes: Severe immediate attrition.
      rules:
        - "Task: Recuperate (Check {Red} 5; Time 1 hour) → Remove this"
        - "Action: Force Yourself Back (Spend {Red} 10) → Remove this"
        - When removed → Add 1 Fatigue to your expended pile
      severity: 2
      tags:
        - General
        - Status_Effect
    Minor Trauma:
      effects:
        - Put 2 Injury cards on top of your deck.
      name: Minor Trauma
      notes: Immediate deck pollution.
      rules:
        - "Task: Steady Yourself (Check {Red} 3; Time 1 min) → Remove this"
        - "Action: Push Through (Spend {Red} 10) → Remove this"
      severity: 1
      tags:
        - General
        - Status_Effect
    Rattled Guard:
      name: Rattled Guard
      notes: Increases the risk from future attacks
      passive: Impact of Defense +1
      rules:
        - "Task: Stretch Out (Check {Yellow} 3; Time 1 min) → Remove this"
        - When removed → Add 2 Fatigue to your expended pile
      severity: 1
      tags:
        - Combat
        - Condition
    Strained Offense:
      name: Strained Offense
      notes: Models minor muscle strain or poor positioning requiring extra effort.
      passive: You must discard a card to perform an Attack Action.
      rules:
        - "Task: First Aid (Check {Blue} 3; Time 1 min; Cost Bandage) → Remove this"
        - When removed → Add 1 Wound to your expended pile
      severity: 1
      tags:
        - Combat
        - Condition
    Taken Out:
      effects:
        - You are unconsious or dying and on longer a meaningful participant in this
          fight
      name: Taken Out
      severity: 3
  fatigueCardTemplate:
    flavor: Fatigue is setting in ...
    name: Fatigue
    rules:
      - "Task: Sleep (Time 2 Hours) → Remove this card."
      - "Task: Light Rest (Time 4 Hours) → Remove this card."
    stats:
      blue: 1
      red: 1
      yellow: 1
    tags:
      - Status
      - Fatigue
      - Physical
  statusCardTemplates:
    Fatigue:
      flavor: Fatigue is setting in ...
      name: Fatigue
      rules:
        - "Task: Sleep (Time 2 Hours) → Remove this card."
        - "Task: Light Rest (Time 4 Hours) → Remove this card."
      stats:
        blue: 1
        red: 1
        yellow: 1
      tags:
        - Status
        - Fatigue
        - Physical
    Injury:
      flavor: A minor injury. The pain is distracting.
      name: Injury
      rules:
        - If this card is in your hand at the end of the Resolve Step, expend it.
        - "Task: Rest (Time 1 Day) → Remove this card."
      stats:
        blue: 0
        red: 0
        yellow: 0
      tags:
        - Status
        - Injury
        - Physical
