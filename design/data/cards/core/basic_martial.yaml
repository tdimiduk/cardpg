# Basic Martial Actions
# Core combat maneuvers available to martial characters.
# Design Standard: Attack Cost 2 is baseline. Cost 1 is Fast.

- id: action-strike
  name: Strike
  type: Action
  tags: [Basic, Combat, Core]
  stats: { red: 3, yellow: 2, blue: 2 }
  cost: { resources: 2 }
  attack:
    color: Red
    power: "|x| + 2"
  flavor: "A solid, disciplined blow."
  notes: "Standard Attack. Cost 2 allows for sustained but not rapid-fire offense."

- id: action-quick-thrust
  name: Quick Thrust
  type: Action
  tags: [Combat, Fast, Finesse]
  stats: { red: 1, yellow: 4, blue: 1 }
  cost: { resources: 1 }
  attack:
    color: Yellow
    power: "|y|"
  flavor: "Testing their guard."
  notes: "Fast Attack. Cost 1 allows for attacking and moving/defending in the same turn easily."

- id: action-mighty-blow
  name: Mighty Blow
  type: Action
  tags: [Combat, Finisher, Heavy]
  stats: { red: 4, yellow: 1, blue: 1 }
  cost: { resources: 3 }
  attack:
    color: Red
    power: "|x| + 5"
  flavor: "Committing everything to a single, devastating impact."
  notes: "Heavy Attack. High cost requires significant setup or risk."

- id: action-defend
  name: Raise Guard
  type: Reaction
  tags: [Basic, Combat, Defense]
  stats: { red: 3, yellow: 3, blue: 2 }
  effects:
    - "Play from hand to add this card's stats to your Defense Total."
    - "This card does not count towards Impact."
  flavor: "Bracing for impact."

- id: action-parry
  name: Parry
  type: Reaction
  tags: [Combat, Defense, Finesse]
  stats: { red: 1, yellow: 4, blue: 2 }
  effects:
    - "Defend Red or Yellow: Strength = |y|"
    - "Play from hand. Does not count towards Impact."
  flavor: "Turning their force aside."
  notes: "Allows using Yellow stats to defend against Red attacks."

- id: action-trip
  name: Trip
  type: Action
  tags: [Combat, Control, Maneuver]
  stats: { red: 2, yellow: 3, blue: 1 }
  cost: { resources: 2 }
  attack:
    color: Yellow
    power: "|y|"
  effects:
    - "If successful, target suffers 'Knocked Down' (Severity 1 Condition)."

- id: action-disengage
  name: Disengage
  type: Action
  tags: [Combat, Movement, Tactical]
  stats: { red: 2, yellow: 2, blue: 2 }
  cost: { resources: 2 }
  effects:
    - "You may leave the engagement without triggering attacks."
    - "Move to a new range band."
