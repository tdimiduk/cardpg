# The Forest Journey
# Act 1: Setting out from the Elven Lands
# Source: Encouters - Forest Journey.csv

- id: mysterious-background
  name: Mysterious Background
  type: Encounter
  tags: [Lore, Setup]
  narrative: "Talking to Carrie and Lily, neither of them know who their parents are or where they came from. Their first memories are of the evil chef."

- id: conversation-ancients
  name: Conversation with the Ancients
  type: Encounter
  tags: [Lore, Setup]
  narrative: "The oldest treefolk in the elven forests know nothing of the origin of the plant dragons, but they do know of an ancient library that might know more."

- id: library-elves
  name: The Library of the Elves
  type: Encounter
  tags: [Lore, Setup]
  narrative: "The elven library has stories passed down through generations that tell of where the ancient draconic library once stood. No one has been there as far back as anyone knows."

- id: the-story
  name: The Story
  type: Encounter
  tags: [Lore, History]
  narrative: "Long ago the humans and dragons lived across the river from the elves and treefolk, but something went wrong and the kingdom of humans fell. Before then the draconic library was in a mirror location to this elven library."

- id: set-out
  name: Set Out on the Journey
  type: Encounter
  tags: [Narrative, Transition]
  narrative: "You begin the journey through the woods to the river. The elven librarians see you off."

- id: familiar-forest
  name: Familiar Forest
  type: Encounter
  tags: [Atmosphere]
  narrative: "The first part of the journey takes you through familiar lands where you have wandered many times growing up."

- id: birds
  name: The Birds
  type: Encounter
  tags: [Atmosphere]
  narrative: "There are happy birds singing in the trees."

- id: wind-branches
  name: Wind in the Branches
  type: Encounter
  tags: [Atmosphere]
  narrative: "The leaves rustle as a gust of wind blows through."

- id: bunnies
  name: Bunnies
  type: Encounter
  tags: [Atmosphere, Cute]
  narrative: "A family of bunnies has a burrow near the path here."

- id: small-stream
  name: Small Stream
  type: Encounter
  tags: [Resource, Rest]
  narrative: "You come across a small stream. A chance to drink, play, and restock your water."
  mechanics:
    effects:
      - "Restock Water / Fatigue Recovery"

- id: apple-pickers
  name: Apple Pickers
  type: Encounter
  tags: [Social, Choice]
  narrative: "You meet another group, going in the same direction but slower. They are going just off the path to pick some apples."
  options:
    - "Join them and collect apples."

- id: peaceful-clearing
  name: Peaceful Clearing
  type: Encounter
  tags: [Atmosphere]
  narrative: "The trees give way to a grassy field filled with flowers."

- id: forest-predators
  name: Forest Predators
  type: Encounter
  tags: [Combat, Wolves]
  narrative: "Two wolves attack your group!"
  mechanics:
    combat:
      enemies: ["wolf", "wolf"]

- id: angry-ogre
  name: Angry Ogre
  type: Encounter
  tags: [Combat, Ogre]
  narrative: "An angry ogre comes the other direction down the road, looking for something to smash."
  mechanics:
    combat:
      enemies: ["ogre"]

- id: travelers-elves
  name: Travelers to the Elves
  type: Encounter
  tags: [Social]
  narrative: "You meet a band of travelers headed towards the elven city you came through."

- id: doe
  name: Doe
  type: Encounter
  tags: [Atmosphere]
  narrative: "A female deer is jumping through the trees."

- id: sturdy-bridge
  name: Sturdy Bridge
  type: Encounter
  tags: [Landmark, Transition]
  narrative: "There is a sturdy wooden bridge, stretching into the fog that covers the great river that separates the kingdom of elves and the (former) kingdom of men."

- id: bees-under-bridge
  name: Bees Under the Bridge
  type: Encounter
  tags: [Quest, Social]
  narrative: "A hive of bees live under the bridge, but they need your help. On the other side of the bridge are ants that come across and steal the bees' flowers."

- id: ants-on-bridge
  name: Ants on the Bridge
  type: Encounter
  tags: [Combat, Quest_Boss]
  narrative: "There is a colony of ants on the other side of the bridge that cross regularly to steal flowers from the bees."
  mechanics:
    combat:
      enemies: ["ant_queen", "ant_soldier", "ant_soldier"]
