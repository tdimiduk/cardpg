# The Monster Chef's House
# Act 2: The rescue of the Plant Dragons
# Source: Encouters - monster chef.csv

- id: picking-mangos
  name: Picking Mangos
  type: Encounter
  tags: [Narrative, Setup]
  narrative: "A strange person shows up and begins picking mangos from Culorn."

- id: secretly-durian
  name: Secretly a Durian
  type: Encounter
  tags: [Narrative, Comedy]
  narrative: "The person picks a durian instead! It explodes in a stinky mess, and they run away."

- id: left-behind-cage
  name: Left Behind Cage
  type: Encounter
  tags: [Narrative, Hook]
  narrative: "As they run away, they drop a large cage with a small orange and green dragon in it."

- id: carrie-story
  name: Carrie's Story
  type: Encounter
  tags: [Lore, Setup]
  narrative: "The dragon (Carrie) tells her story..." # Placeholder for empty CSV row

- id: big-house
  name: A Big House
  type: Encounter
  tags: [Atmosphere, Landmark]
  narrative: "In the woods there is a big house with smoke coming out of the chimney. It looks out of place this deep in the forest."

- id: two-lowves
  name: Two Lowves
  type: Encounter
  tags: [Trap, Combat]
  narrative: "There are large loaves of bread by the front door... suddenly they stand up! They are actually bread wolves."
  mechanics:
    combat:
      enemies: ["bread_wolf", "bread_wolf"]

- id: entry
  name: Entry
  type: Encounter
  tags: [Atmosphere, Flavor]
  narrative: "There is a large door, looking kind of like a graham cracker between two suspiciously pretzel-stick-like logs."

- id: strange-aroma
  name: Strange Aroma
  type: Encounter
  tags: [Atmosphere]
  narrative: "As you move through the house you smell something strange, which is both sweet and kind of gross."

- id: cages
  name: Cages
  type: Encounter
  tags: [Atmosphere, Lore]
  narrative: "In a bedroom there are a bunch of empty cages, made of strong metal and big enough to hold a creature like Carrie."

- id: rotting-vegetables
  name: Hall of Rotting Vegetables
  type: Encounter
  tags: [Atmosphere]
  narrative: "In the hall you walk down there are shelves full of old vegetables, seemingly left here to intentionally rot."

- id: ice-screamers
  name: Ice Screamers
  type: Encounter
  tags: [Combat]
  narrative: "You encounter a large freezer making a strange sound."
  mechanics:
    combat:
      enemies: ["ice_screamer", "ice_screamer", "ice_screamer"]

- id: dinner-table
  name: Dinner Table
  type: Encounter
  tags: [Combat]
  narrative: "There is a large table with a large cake holding a knife and fork."
  mechanics:
    combat:
      enemies: ["cake_slicer"]

- id: gingerbread-pan
  name: Gingerbread Pan
  type: Encounter
  tags: [Combat]
  narrative: "In the kitchen there is a giant oven. As you enter the room, three fully baked gingerbread men—one of them wearing armor—jump out at you!"
  mechanics:
    combat:
      enemies: ["gingerbread_knight", "gingerbread_soldier", "gingerbread_soldier"]

- id: evil-chef
  name: The Evil Chef
  type: Encounter
  tags: [Combat, Boss]
  narrative: "Hiding in the pantry you find the Chef! He attacks you with his knife and a pan."
  mechanics:
    combat:
      enemies: ["evil_chef"]

- id: mystical-vegetables
  name: Mystical Vegetables
  type: Encounter
  tags: [Reward, Loot]
  narrative: "You find some spinach, a carrot, and a cucumber glowing with magical energy."
  mechanics:
    rewards:
      - type: "item"
        name: "Magical Spinach"
        tags: [Consumable, Stat_Boost]
        effect: "Permanent Stat Increase"
        value: { red: 1, yellow: 1, blue: 2 }
        
      - type: "item"
        name: "Magical Carrot"
        tags: [Consumable, Stat_Boost]
        effect: "Permanent Stat Increase"
        value: { red: 1, yellow: 2, blue: 1 }
        
      - type: "item"
        name: "Magical Cucumber"
        tags: [Consumable, Stat_Boost]
        effect: "Permanent Stat Increase"
        value: { red: 2, yellow: 1, blue: 1 }

- id: lili-dragon
  name: Lili Dragon
  type: Encounter
  tags: [Narrative, Quest_Complete]
  narrative: "In the back room there is a small cage similar to the one Carrie was in, containing a flowery dragon."
