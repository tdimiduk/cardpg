# The Knowledge Index
#
# This file is the master index of the `cardpg` project's design landscape.
# It functions as a focused "knowledge map" for Gemini and AI assistants.
# The AI uses this map to navigate the design structure, rules, and research.
#

introductory_materials:
  - name: "Introduction"
    id: "introduction"
    path: "introduction.md"
    source_type: "local_file"
    purpose: "The primary player-facing introduction to the game. Sets the tone, theme, and core player experience before the rules are presented."
    type: "Introductory Text"
    tags: ["doc-type:introductory-text", "audience:player-facing"]
  - name: "Root Readme"
    id: "readme-root"
    path: "README.md"
    source_type: "local_file"
    purpose: "The root orientation document for the repository."
    type: "Meta Document"
    tags: ["doc-type:meta", "audience:designer-facing"]
  - name: "Research Readme"
    id: "readme-research"
    path: "research/README.md"
    source_type: "local_file"
    purpose: "Orientation for the research directory."
    type: "Meta Document"
    tags: ["doc-type:meta", "audience:designer-facing"]

  - name: "Agent Design Rules"
    id: "agents-design-rules"
    path: "AGENTS.md"
    source_type: "local_file"
    purpose: "Operating rules, canonical hierarchies, and subagent delegation instructions for AI assistants working in the design directory."
    type: "Meta Document"
    tags: ["doc-type:meta", "audience:designer-facing"]

project_foundation:
  philosophy:
    - name: "Guiding Principles"
      id: "guiding-principles"
      path: "philosophy/guiding-principles.md"
      source_type: "local_file"
      purpose: "The 'Why.' The ultimate authority on the project's creative vision and core philosophies."
      type: "Design Philosophy"
      tags:
        [
          "doc-type:philosophy",
          "audience:designer-facing",
          "core-concept:design-vision",
          "core-concept:pillars-of-play",
        ]
    - name: "Game Settings"
      id: "game-settings"
      path: "philosophy/game-settings.md"
      source_type: "local_file"
      purpose: "A designer-facing document explaining how to tune the game's tone and mechanics to create curated play experiences, from grim realism to lighthearted adventure."
      type: "Design Philosophy"
      tags:
        [
          "doc-type:philosophy",
          "audience:designer-facing",
          "core-concept:design-vision",
          "core-concept:game-tone",
        ]
  design_patterns:
    - name: "Design Precepts"
      id: "design-precepts"
      path: "philosophy/design-precepts.md"
      source_type: "local_file"
      purpose: "The 'How-To.' Provides concrete design patterns and case studies for creating new mechanics."
      type: "Design Patterns"
      tags:
        [
          "doc-type:philosophy",
          "audience:designer-facing",
          "core-concept:design-patterns",
          "core-concept:core-mechanic",
          "core-concept:hand-management",
          "core-concept:status-cards",
        ]
    - name: "Paradigm Shifts"
      id: "paradigm-shifts"
      path: "methodology/paradigm-shifts.md"
      source_type: "local_file"
      purpose: "An onboarding guide for designers familiar with other TTRPGs, detailing the core assumptions they need to 'un-learn' to design for this system effectively."
      type: "Meta Document"
      tags:
        [
          "doc-type:meta",
          "audience:designer-facing",
          "core-concept:design-patterns",
        ]
  methodology:
    - name: "Documentation Standards"
      id: "documentation-standards"
      path: "methodology/documentation-standards.md"
      source_type: "local_file"
      purpose: "The official style guide for creating and formatting all design documents in the project, ensuring clarity, consistency, and structural integrity."
      type: "Meta Document"
      tags: ["doc-type:meta", "audience:designer-facing"]
    - name: "Tag Glossary"
      id: "tag-glossary"
      path: "methodology/tag-glossary.md"
      source_type: "local_file"
      purpose: "The canonical reference for the project's tagging system. Defines the scope and usage of all tags to ensure metadata consistency."
      type: "Meta Document"
      tags: ["doc-type:meta", "audience:designer-facing"]

