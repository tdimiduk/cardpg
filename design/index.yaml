sub_indexes:
  - name: "Iteration Index"
    id: "index-iteration"
    path: "iteration/index.yaml"
    source_type: "local_file"
    purpose: "Sub-index for active design explorations, mechanical constraints, proposals, and ideation sketches."
    type: "Index"
    tags: ["doc-type:index", "audience:designer-facing"]

  - name: "Research Index"
    id: "index-research"
    path: "research/index.yaml"
    source_type: "local_file"
    purpose: "Sub-index mapping empirical research reports, verisimilitude sources, living research syntheses, and game design theory/ludology literature notes across the Two-Track model."
    type: "Index"
    tags: ["doc-type:index", "audience:designer-facing"]

  - name: "Archive Index"
    id: "index-archive"
    path: "archive/index.yaml"
    source_type: "local_file"
    purpose: "Sub-index preserving archived playtest content, legacy spreadsheets, and superseded research."
    type: "Index"
    tags: ["doc-type:index", "audience:designer-facing"]

global_registries:
  - name: "Card Catalog"
    id: "registry-cards"
    path: "../data/cards/_manifest.yaml"
    source_type: "local_file"
    purpose: "The master index for all game objects (Cards, Items, Encounters). Used by the VTT build pipeline."
    type: "Registry"
    tags: ["doc-type:registry", "audience:builder"]

  - name: "Data Schema & Syntax"
    id: "meta-data-schema"
    path: "../data/cards/README.md"
    source_type: "local_file"
    purpose: "Technical documentation for the YAML schema and notation syntax used in card definitions."
    type: "Meta Document"
    tags: ["doc-type:meta", "audience:builder", "audience:designer-facing"]

game_content_design:
  active_content:
    - name: "Consequence Decks"
      id: "gdoc-consequences"
      path: "https://docs.google.com/spreadsheets/u/0/d/1H49JzTbhXSZzbtooRIRm5wj3Kd9GD4Yq7xeztLDoRWU/edit"
      source_type: "google_sheet"
      purpose: "The primary spreadsheet for consequence card design."
      type: "Cards"
      tags:
        [
          "doc-type:content-library",
          "audience:designer-facing",
          "core-concept:cards",
          "core-concept:consequences",
          "core-concept:harm",
        ]
      sheets:
        - {
            name: "combat-general",
            purpose: "Consequences cards for direct combat action or other physical harm.",
          }
        - {
            name: "task-general",
            purpose: "Contains consequences for non-combat tasks.",
          }
        - {
            name: "Conditions",
            purpose: "Lists ongoing status effects that characters can gain.",
          }
    - name: "Encounters (2025)"
      id: "gdoc-encounters-2025"
      path: "https://docs.google.com/spreadsheets/d/1iIy53SLPovtR9VlpGvmtJ1Q8Vmv0cUyJEx83_0iE9WI/edit?gid=0#gid=0"
      source_type: "google_sheet"
      purpose: "Adventure decks from a recent playtest campaign, mostly up to date with current rules."
      type: "Cards"
      tags:
        [
          "doc-type:content-library",
          "audience:designer-facing",
          "core-concept:cards",
          "core-concept:npc-design",
        ]
