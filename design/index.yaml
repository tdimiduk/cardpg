# The Knowledge Index
#
# This file is the master index of the `cardpg` project's design landscape.
# It functions as a focused "knowledge map" for Gemini Gems and AI assistants.
# The AI uses this map to navigate the design structure, rules, and research.
#
# Document Lifecycle & Status Guide:
# - Canon: Current, authoritative rules, philosophies, and data. Always prioritize these.
# - Leading-Edge: Active, draft-status ideas or proposals. Use as context for current direction.
# - Archived: Outdated, historical playtest content. DO NOT treat as current rules, but use as design reference or examples.

introductory_materials:
  - name: "Introduction"
    id: "introduction"
    path: "introduction.md"
    source_type: "local_file"
    purpose: "The primary player-facing introduction to the game. Sets the tone, theme, and core player experience before the rules are presented."
    type: "Introductory Text"
    status: "Leading-Edge"
    tags: ["doc-type:introductory-text", "audience:player-facing"]
  - name: "Root Readme"
    id: "readme-root"
    path: "README.md"
    source_type: "local_file"
    purpose: "The root orientation document for the repository."
    type: "Meta Document"
    status: "Canon"
    tags: ["doc-type:meta", "audience:designer-facing"]
  - name: "Research Readme"
    id: "readme-research"
    path: "research/README.md"
    source_type: "local_file"
    purpose: "Orientation for the research directory."
    type: "Meta Document"
    status: "Canon"
    tags: ["doc-type:meta", "audience:designer-facing"]

