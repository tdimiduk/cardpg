# The Iteration Index
#
# This file maps out active design explorations, proposals, mechanical constraints,
# and ideation sketches. Documents here represent unsettled ideas under active exploration.

active_design_exploration:
  orientation:
    - path: "iteration/README.md"
      purpose: "Orientation and operating conventions for active design exploration and proposals."
      tags: ["doc-type:meta", "audience:designer-facing"]

  mechanical_constraints:
    - path: "iteration/resolution-design-constraints.md"
      purpose: "Authoritative reference for architectural constraints, tabletop ergonomics, and evaluation criteria that any proposed Core Resolution Mechanic must satisfy."
      tags: ["doc-type:iteration", "audience:designer-facing", "core-concept:action-resolution", "core-concept:hand-management", "core-concept:fatigue", "core-concept:harm"]

    - path: "iteration/resolution-pitfalls.md"
      purpose: "Authoritative catalog of recurring mechanical failure modes, degenerate incentives, and tabletop friction points discovered across resolution iterations."
      tags: ["doc-type:iteration", "audience:designer-facing", "core-concept:action-resolution", "core-concept:hand-management", "core-concept:fatigue", "core-concept:harm"]

  resolution_and_combat_proposals:
    - path: "iteration/consequence-pool-tag-escalation/index.yaml"
      purpose: "Comprehensive proposal suite replacing legacy Defense/Resilience with a Consequence Pool and Tag Escalation drafting engine."
      tags: ["doc-type:iteration", "audience:designer-facing", "core-concept:action-resolution", "core-concept:consequences", "core-concept:armor"]

    - path: "iteration/resolution-exploration.md"
      purpose: "An honest critique of legacy resolution mechanics (Defense/Resilience) and exploration of alternatives, particularly 'Declared Defenses.'"
      tags: ["doc-type:iteration", "audience:designer-facing", "core-concept:action-resolution", "core-concept:consequences", "core-concept:hand-management"]

    - path: "iteration/defense-action.md"
      purpose: "Exploration of active defense action mechanics and timing."
      tags: ["doc-type:ideation", "audience:designer-facing", "core-concept:defense", "core-concept:action-resolution"]

  mechanics_and_resource_proposals:
    - path: "iteration/fatigue-change-proposal.md"
      purpose: "A proposal to change fatigue from 'add cards to deck' to 'overlay cards in deck' using physical card sleeves, keeping deck size constant."
      tags: ["doc-type:iteration", "audience:designer-facing", "core-concept:fatigue", "core-concept:status-cards"]

  ideation_and_sketches:
    - path: "iteration/design-sketchbook.md"
      purpose: "A collection of specific mechanic ideas and explorations; look here to see if an idea exists prior to formalization."
      tags: ["doc-type:ideation", "audience:designer-facing"]
