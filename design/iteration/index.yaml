# The Iteration Index
#
# This file maps out active design explorations, proposals, mechanical constraints,
# and ideation sketches. Documents here represent unsettled ideas under active exploration.

active_design_exploration:
  ideation_and_sketches:
  - path: iteration/design-sketchbook.md
    purpose: A collection of specific mechanic ideas and explorations; look here to
      see if an idea exists prior to formalization.
    tags:
    - doc-type:ideation
    - audience:designer-facing
  - path: iteration/card-art-rendering-pipeline-brief.md
    purpose: Pipeline to embed live card layouts into rules documentation from data/cards/
      YAML definitions using native Reflex components.
    tags:
    - doc-type:iteration
    - audience:designer-facing
  - path: iteration/resolution/universal-consequence-authoring.md
    purpose: Universal style and authoring guide for consequence and condition cards
      across all caRdPG resolution engines.
    tags:
    - doc-type:iteration
    - audience:designer-facing
    - core-concept:consequences
    - core-concept:harm
  - path: iteration/resolution/consequence-scaling-and-recovery.md
    purpose: Design brief exploring how consequence passive penalties, in-combat action
      recoveries, and out-of-combat task checks interact with character progression
      and scale invariance.
    tags:
    - doc-type:iteration
    - audience:designer-facing
    - core-concept:consequences
    - core-concept:harm
    - core-concept:action-resolution
  macro_structure_and_traces:
  - name: 'Design Brief: Macro Structure, Session Cadence, and Campaign Roadmap'
    path: iteration/macro-structure-and-gameplay-loop-brief.md
    purpose: Articulates and formalizes the macro-level gameplay loop, session cadence,
      and campaign lifecycle connecting crisis resolution and exploration.
    tags:
    - doc-type:iteration
    - audience:designer-facing
    - core-concept:pacing
    - pillar:exploration
    - pillar:downtime
  - name: 'Design Brief: Exploration Procedures, Dungeon Clocks, and Location Decks'
    path: iteration/exploration-decks-and-dungeon-clocks-brief.md
    purpose: Table procedures for Adventuring Time, formalizing the 6-Tick Turn Wheel,
      Location Decks, and Effort Cycle pacing.
    tags:
    - doc-type:iteration
    - audience:designer-facing
    - core-concept:pacing
    - pillar:exploration
  - name: 'Design Brief: Crisis Round Duration and Phrase Cadence'
    path: iteration/crisis-round-duration-and-phrase-cadence-brief.md
    purpose: Finalizes the 2.0-3.0 second round duration, aligns deck cycle math with
      ATP-PCr energetics, and evaluates adopting the 'Phrase of Arms' concept.
    tags:
    - doc-type:iteration
    - audience:designer-facing
    - pillar:combat
    - core-concept:pacing
    - core-concept:action-resolution
  - name: 'Design Brief: Movement, Area Control, and Reach Priority in Simultaneous
      Crisis Time'
    path: iteration/movement-area-control-and-reach-priority-brief.md
    purpose: Deep dive on movement, spatial interception, area control, and reach
      priority in 2-3s simultaneous rounds without Attacks of Opportunity.
    tags:
    - doc-type:iteration
    - audience:designer-facing
    - pillar:combat
    - core-concept:movement
    - core-concept:spacing
    - core-concept:disengagement
  - name: 'Design Brief: Action Stack Accumulation for Extended Actions'
    path: iteration/action-stack-accumulation-for-extended-actions-brief.md
    purpose: Authoring framework and rules standard for multi-round Crisis Time actions
      via progressive Action Stack accumulation across Plan Steps.
    tags:
    - doc-type:iteration
    - audience:designer-facing
    - pillar:combat
    - core-concept:action-resolution
  - name: Gameplay Traces & Empirical Benchmarks
    path: iteration/traces/index.yaml
    purpose: Multi-resolution gameplay traces, character ledgers, and empirical benchmark
      scenarios testing combat, fatigue, and expedition pacing.
    tags:
    - doc-type:iteration
    - audience:designer-facing
    - core-concept:action-resolution
    - core-concept:fatigue
    - core-concept:pacing
    - core-concept:harm
    - core-concept:consequences
    - pillar:combat
    - pillar:exploration
    - pillar:social
  - name: 'Campaign Workshop: The Outlaw of Weeping Fen'
    path: iteration/campaign-weeping-fen/index.yaml
    purpose: 'Development benchmark scenario: a short, complete campaign arc testing
      travel, non-combat general actions, tactical combat, persistent harm, and the
      living world clock in the Grounded Heroism setting.'
    tags:
    - doc-type:iteration
    - audience:designer-facing
    - pillar:combat
    - pillar:exploration
    - pillar:social
    - pillar:downtime
    - core-concept:pacing
  - name: 'Campaign Workshop: The Delve of Crag-Gallows'
    path: iteration/campaign-crag-gallows/index.yaml
    purpose: 'Zero-GM benchmark scenario: a procedural dungeon and wilderness crawl
      testing fatigue accumulation, consequence escalation, push-your-luck retreat
      loops, and living clock decks using existing monster cards.'
    tags:
    - doc-type:iteration
    - audience:designer-facing
    - pillar:combat
    - pillar:exploration
    - pillar:social
    - pillar:downtime
    - core-concept:fatigue
    - core-concept:consequences
    - core-concept:pacing
