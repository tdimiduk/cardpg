      source_type: "local_file"
      purpose: "An honest critique of legacy resolution mechanics (Defense/Resilience) and exploration of alternatives, particularly 'Declared Defenses.'"
      type: "Design Exploration"
      tags:
        [
          "doc-type:iteration",
          "audience:designer-facing",
          "core-concept:action-resolution",
          "core-concept:consequences",
          "core-concept:hand-management",
        ]

    - name: "Defense Action Iteration"
      id: "ideation-defense-action"
