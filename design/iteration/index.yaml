# The Iteration Index
#
# This file is a sub-index of the `cardpg` project's design landscape,
# specifically mapping out active design explorations, proposals, mechanical constraints,
# and ideation sketches.
#
# Documents here represent unsettled ideas under active exploration.

active_design_exploration:
  mechanical_constraints:
    - name: "Resolution System Design Constraints"
      id: "iteration-resolution-constraints"
      path: "iteration/resolution-design-constraints.md"
      source_type: "local_file"
      purpose: "Authoritative reference for architectural constraints, tabletop ergonomics, and evaluation criteria that any proposed Core Resolution Mechanic must satisfy."
      type: "Design Constraints"
      tags:
        [
          "doc-type:iteration",
          "audience:designer-facing",
          "core-concept:action-resolution",
          "core-concept:hand-management",
          "core-concept:fatigue",
          "core-concept:harm",
        ]

  resolution_and_combat_proposals:
    - name: "Consequence Pool & Tag Escalation Engine"
      id: "iteration-consequence-pool-engine"
      path: "iteration/consequence-pool-tag-escalation/README.md"
      source_type: "local_file"
      purpose: "Comprehensive proposal suite replacing legacy Defense/Resilience with a Consequence Pool and Tag Escalation drafting engine."
      type: "Design Exploration Suite"
      tags:
        [
          "doc-type:iteration",
          "audience:designer-facing",
          "core-concept:action-resolution",
          "core-concept:consequences",
          "core-concept:armor",
        ]
      components:
        proposal: "iteration/consequence-pool-tag-escalation/proposal.md"
        proposal_long: "iteration/consequence-pool-tag-escalation/proposal-long.md"
        guide: "iteration/consequence-pool-tag-escalation/guide-to-writing-consequences.md"
        card_db: "iteration/consequence-pool-tag-escalation/consequences.yaml"
        equipment: "iteration/consequence-pool-tag-escalation/equipment.yaml"
        trace_1: "iteration/consequence-pool-tag-escalation/trace-1-unarmored-skirmish.md"
        trace_2: "iteration/consequence-pool-tag-escalation/trace-2-armored-knight-power-strike.md"
        trace_3: "iteration/consequence-pool-tag-escalation/trace-3-tag-escalation-spiral.md"
        trace_4: "iteration/consequence-pool-tag-escalation/trace-4-mob-combat-multi-attacker.md"
        critique_and_seeds: "iteration/consequence-pool-tag-escalation/critique-and-brainstorming-seeds.md"
        gm_guide_patch: "iteration/consequence-pool-tag-escalation/gamemaster-guide-patch.md"
        players_guide_patch: "iteration/consequence-pool-tag-escalation/players-guide-patch.md"

    - name: "Resolution Mechanic Exploration"
      id: "iteration-resolution-exploration"
