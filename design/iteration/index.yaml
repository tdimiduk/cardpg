    tags:
    - doc-type:iteration
    - audience:designer-facing
    - pillar:exploration
    - pillar:combat
    - core-concept:fatigue
    - core-concept:encumbrance
    - core-concept:pacing
  - path: iteration/carrying-capacity-benchmarks.md
    purpose: Empirically calibrated benchmark dataset for weapons, armor, containers,
