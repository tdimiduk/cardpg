# caRdPG Consequence Card Database (Exploration & Prototype)
# Structured under the 4-Tier Severity Scale and Tag Vulnerability Exploitation Engine.
# Calibrated against General Action Difficulty (design/rules/gamemaster-guide.md)
# and clinical/biomechanical research (design/research/synthesis/consequence-database.md).
#
# Design Standards Enforced:
#   1. Continual Passives: No one-shot "the next..." phrasing. All effects are continual states until cleared.
#   2. Action vs. Task Duality:
#      - Actions (In-Combat): High friction, high spend, card suppression/tucking, fatigue generation, or tradeoffs.
#      - Tasks (Out-of-Combat): Narrative time, tools, and reasonable checks with less friction and no panic.
#   3. Suppression Mechanics: Uses "Place X cards on top of this to cover its passive and suppress its effect..."
#   4. Requires vs. Cost: Tools/facilities are 'Requires'; consumable resources are 'Cost'.
#   5. Lingering Attrition: Field removals often include 'When removed → Place status card in deck/expended pile'.
#   6. Tag Vulnerability Exploitation:
#      - Cards expose 2 to 4 Leaf Tags under 'vulnerable:' matching anatomical, positional, or psychological openings.
#      - During Step 3, matching unplaced candidates (Tier K <= S) placed onto this condition draw +1 candidate from Tier K+1.
#      - Root tags ('physical', 'injury', 'combat') are banned from 'vulnerable:' lists.
#   7. State Superseding, Redraws, & Setbacks:
#      - 'supersedes:' specifies weaker conditions on the same binary track automatically discarded when this card enters play.
#      - 'redraw:' specifies same-tier redraw rules for non-stackable binary conditions.
#      - 'setback:' attached to mitigation/recovery actions defines progress resets when interrupted by subsequent trauma.
#   8. Intra-Tier Dynamic Range in Tier 1:
#      - Softer / Clearable Band (Priority 1-3): Clearable within 1-2 actions or card-tucking; kindling for tag escalation.
#      - Sharp / Punishing Band (Priority 4-5): Stiff tactical locks that severely constrain actions/defense.
#   9. Priority Ratings: Every card includes an integer 'priority: 1-5' representing aggregate threat/badness within its tier for fast default curation and VTT automation.

# ==============================================================================
# TIER 1: TACTICAL IMPAIRMENTS & SETBACKS
# Dynamic range from clearable friction (Priority 1-3) to stiff tactical locks (Priority 4-5)
# ==============================================================================

# --- TIER 1: SOFTER / CLEARABLE BAND (Priority 1-3) ---

- name: Poor Footing
  severity: 1
  priority: 2
  tags:
    - positioning
    - physical
  vulnerable:
    - positioning
    - limbs
  redraw: If you already have this condition (or a higher positioning state) in play, the attacker may redraw this candidate at the same tier.
  rules:
    - passive: The Impact of your defenses is increased by 1.
    - action: Regain Footing (Place a card from your hand on top of this. When 2 cards are on top of this, expend them and remove this).
    - task: Catch Balance (Time 1 min) -> Remove this.
  notes: >
    Physiological / Biomechanical Basis: Center-of-mass displacement and base-of-support disruption.
    Unstable footing increases reaction latency and forces compensatory muscular effort, inflating defensive Impact.
    In combat, clearing requires spending 2 cards of deliberate footwork; out of combat, simple balance recovery is trivial.
    Vulnerability: Compromised stance exposes positioning and limbs, allowing matching attacks to promote into Tier 2 trauma.

- name: Winded
  severity: 1
  priority: 2
  tags:
    - fatigue
    - exertion
  vulnerable:
    - exertion
    - positioning
    - torso
  redraw: If you already have this condition in play, the attacker may redraw this candidate at the same tier.
  rules:
    - passive: Whenever you declare an Attack Action, suffer 1 Fatigue.
    - action: Catch Breath (Spend {Red} 10) -> Remove this.
    - task: Recover Breath (Time 1 min) -> Remove this.
  notes: >
    Physiological Basis: Acute anaerobic exertion and transient diaphragm compression/spasm. Rapid depletion of
    intracellular ATP-PCr stores forces short, shallow respiration, penalizing aggressive attacks until a brief
    pause to catch breath. Replaces transient 'Out of Breath' with active on-table presence.
    Vulnerability: Laborious breathing and diaphragm recovery expose torso and exertion to rapid Tier 2 promotion.

- name: Dust in Eyes
  severity: 1
  priority: 3
  tags:
    - sensory
    - eyes
  vulnerable:
    - sensory
    - head
    - positioning
  redraw: If you already have this condition in play, the attacker may redraw this candidate at the same tier.
  rules:
    - passive: You cannot play Defend cards from hand to meet incoming attack Strength.
    - action: Rub & Blink (Place a `Pain` status card on top of your deck) -> Remove this.
    - task: Clean Eye Wash (Time 1 min; Requires Clean Water) -> Remove this.
  notes: >
    Physiological Basis: Foreign particulate in the conjunctival sac triggers immediate lacrimation and blepharospasm.
    Loss of visual acuity prevents anticipating incoming strikes with hand defense until flushed.
    In combat, aggressively rubbing your eyes clears vision immediately but scratches the cornea, inserting an immediate
    `Pain` status card onto your deck. Out of combat, a gentle 1-minute water rinse clears it safely with zero penalty.
    Vulnerability: Impaired vision creates dangerous blind spots, exposing head and sensory zones to Tier 2 promotion.

- name: Singed Sleeves
  severity: 1
  priority: 1
  tags:
    - arcane
    - fire
  vulnerable:
    - fire
    - arcane
    - hands
  redraw: If you already have this condition in play, the attacker may redraw this candidate at the same tier.
  rules:
    - passive: Whenever you declare a {Blue} action, suffer 1 Fatigue.
    - action: Pat Out Smolder (Spend {Yellow} 15) -> Remove this.
    - task: Brush Off Ash (Time 30 sec) -> Remove this.
  notes: >
    Physical Basis: Residual smoldering of garments/sleeves from magical sparks or heat bloom. Distracts the caster
    during somatic casting motions, imposing a fatigue cost until patted out.
    Vulnerability: Smoldering fabric and heat stress expose hands and arcane actions to Tier 2 burn promotion.

- name: Rattled Nerves
  severity: 1
  priority: 2
  tags:
    - fear
    - mental
  vulnerable:
    - fear
    - mental
    - positioning
  redraw: If you already have this condition (or a higher fear state) in play, the attacker may redraw this candidate at the same tier.
  rules:
    - passive: Whenever you draw cards at the start of a round, expend 1 card from hand.
    - action: Steady Nerves (Spend {Blue} 15) -> Remove this.
    - task: Deep Breath (Time 1 min) -> Remove this.
  notes: >
    Psychological Basis: Sympathetic nervous surge and hand tremors after facing sudden lethality. Forces premature
    card expenditure during hand management.
    Vulnerability: Tremors and hyper-arousal impair composure, exposing fear and mental tags to Tier 2 escalation.

- name: Slightly Battered
  severity: 1
  priority: 1
  tags:
    - physical
    - injury
  vulnerable:
    - positioning
    - exertion
  rules:
    - passive: The Impact of all future defenses against you is increased by 1.
    - action: Shake Off Impact (Spend {Red} 15) -> Remove this.
    - task: Catch Breath & Tend Bruises (Time 5 min) -> Remove this.
  notes: >
    Physiological Basis: Superficial muscle contusion and soft-tissue microtrauma. General soreness increases defensive
    reaction latency (+1 Impact). Easily shaken off with exertion or a few minutes of quiet rest.
    Vulnerability: General tissue soreness degrades kinetic efficiency, exposing positioning and exertion.

# --- TIER 1: SHARP / PUNISHING BAND (Priority 3-5) ---

- name: Off Balance
  severity: 1
  priority: 4
  tags:
    - positioning
    - combat
  vulnerable:
    - positioning
    - limbs
    - torso
  supersedes:
    - Poor Footing
  redraw: If you already have this condition (or Knocked Prone) in play, the attacker may redraw this candidate at the same tier.
  rules:
    - passive: The Impact of your defenses is increased by 1. You cannot take Move actions or play Defend cards from hand.
    - action: Regain Center (Spend {Yellow} 20) -> Remove this.
    - task: Recover Footing (Time 10 sec) -> Remove this.
  notes: >
    Biomechanical Basis: Dynamic equilibrium loss. The vestibular system is intact, but the kinetic chain is completely
    broken, preventing directional evasion or braced weapon parries until posture is deliberately reset.
    Subsumes +1 Impact from Poor Footing.
    Vulnerability: Severe posture breakdown exposes positioning, limbs, and torso, promoting matching attacks to Tier 2.

- name: Afraid
  severity: 1
  priority: 4
  tags:
    - fear
    - mental
  vulnerable:
    - fear
    - mental
    - positioning
  supersedes:
    - Rattled Nerves
  redraw: If you already have this condition (or Terrified) in play, the attacker may redraw this candidate at the same tier.
  rules:
    - passive: You must expend 1 card from hand to make a melee attack or willingly move closer to a foe.
    - action: Martial Fury Surge (Spend {Red} 25) -> Remove this.
    - task: Center Yourself (Check {Blue} 15; Time 5 min) -> Remove this.
  notes: >
    Psychological Basis: Acute stress reaction. Amygdala activation suppresses offensive motor initiation, requiring
    a conscious expenditure of resolve (1 card from hand) to close the distance or strike.
    Vulnerability: Overwhelming fight-or-flight inhibition leaves mental resolve and positioning vulnerable to Tier 2 promotion.

- name: Strained Offense
  severity: 1
  priority: 3
  tags:
    - physical
    - arms
    - combat
  vulnerable:
    - arms
    - exertion
    - positioning
  rules:
    - passive: You must expend 1 card from your hand whenever you declare an Attack Action.
    - action: Force Through Spasm (Spend {Red} 20) -> Remove this.
    - when removed (via Action): Place 1 `Fatigue` card on top of your deck.
    - task: First Aid & Muscle Wrap (Check {Blue} 15; Time 1 hour; Cost Bandage; Requires Splint) -> Remove this.
  notes: >
    Physiological Basis: Grade I muscle strain / tendon hyper-extension in the forearm or rotator cuff. Explosive weapon
    acceleration triggers protective neuromuscular inhibition, forcing hand card loss when attacking.
    Vulnerability: Weakened muscular structure in the arms exposes the limb to severe structural trauma.

- name: Bleeding Cut
  severity: 1
  priority: 4
  tags:
    - physical
    - bleeding
  vulnerable:
    - bleeding
    - exertion
  rules:
    - passive: Whenever you flip 3 or more cards from your deck to defend an attack, expend 1 additional card from the top of your deck.
    - action: Apply Field Tourniquet/Pressure (Spend {Red} 20) -> Remove this.
    - when removed (via Action): Place 1 `Pain` card on top of your deck.
    - task: Thorough Wound Cleaning & Suture (Check {Blue} 20; Time 30 min; Cost Bandage & Antiseptic) -> Remove this.
    - when removed (via Task): Place 1 `Minor Wound` into your expended pile.
  notes: >
    Clinical Basis: Class II Hemorrhage through a deep dermal/muscular laceration. High cardiac output from vigorous defense
    causes renewed arterial bleeding bursts, expending extra deck cards. Multiple cuts may exist in parallel.
    Vulnerability: Open vascular compromise exposes bleeding and exertion tags, promoting further cutting trauma to higher tiers.

- name: Dazed
  severity: 1
  priority: 4
  tags:
    - sensory
    - head
    - cognitive
  vulnerable:
    - head
    - sensory
    - positioning
  redraw: If you already have this condition (or a Concussion) in play, the attacker may redraw this candidate at the same tier.
  rules:
    - passive: You cannot play cards with printed cost of 3 or higher.
    - action: Shake Head Clear (Spend {Red} 20) -> Remove this.
    - task: Rest & Regain Focus (Time 10 min) -> Remove this.
  notes: >
    Neurological Basis: Transient blunt force jar to the skull. Temporary disruption of vestibular and cognitive tracking
    prevents executing complex, multi-card combos until cleared. Can enter play in parallel alongside Mild Concussion.
    Vulnerability: Disoriented tracking and compromised guard leave head and sensory zones vulnerable to Tier 2 concussion.

# ==============================================================================
# TIER 2: PLATFORM CEILINGS & MODERATE BODILY TRAUMA
# ==============================================================================

- name: Knocked Prone
  severity: 2
  priority: 5
  tags:
    - positioning
    - combat
  vulnerable:
    - positioning
    - limbs
    - torso
    - head
  supersedes:
    - Poor Footing
    - Off Balance
  redraw: While Knocked Prone, the attacker may redraw any positioning candidate drawn against you at the same tier.
  rules:
    - passive: You are prone. You can only crawl; you must expend 1 card from hand to move or attack.
    - passive: The Impact of your defenses is increased by 1.
    - action: Struggle to Feet (Place cards from hand on top of this. When the cards on top of this exceed your `Burden`, expend them and remove this).
    - setback: "If you suffer an attack or consequence while cards are on top of this, jarring impact breaks your leverage: expend those cards and remain prone."
    - action: Athletic Kip-Up (Spend {Yellow} 30) -> Remove this.
    - task: Stand Up (Time 5 seconds) -> Remove this.
  notes: >
    Biomechanical Basis: Total loss of upright stance under heavy kinetic impact. Subsumes +1 Impact from prior positioning wear.
    In combat, getting up in heavy gear requires building mechanical leverage (tucking cards equal to Burden)
    or executing an explosive Yellow 30 acrobatic leap. Out of combat, standing up is instantaneous.
    Vulnerability Multiplier: Grounded immobility completely exposes positioning, limbs, torso, and head. Under the Anvil Principle,
    matching Tier 2 attacks promote directly into Tier 3 structural bodily trauma.

- name: Mild Concussion
  severity: 2
  priority: 3
  tags:
    - cognitive
    - sensory
    - head
  vulnerable:
    - head
    - sensory
    - positioning
    - mental
  supersedes:
    - Dazed
  redraw: If you already have this condition (or Severe Concussion) in play, the attacker may redraw this candidate at the same tier.
  rules:
    - passive: While you have at least 5 cards in your hand, replace your upkeep draw with "Draw 1, expend 1 from top of deck".
    - task: Strict Cognitive Rest & Darkness (Check {Blue} 30; Time 1 day; Requires Darkened Shelter) -> Remove this.
  notes: >
    Neurological Basis: Transient neurological dysfunction caused by biomechanical acceleration/deceleration forces
    of the brain within the skull. Disrupts complex multi-tasking and cognitive synthesis, penalizing large hand holding.
    No in-combat action can reset brain contusions; recovery requires 1 day of cognitive rest (Blue 30).
    Vulnerability: Cranial trauma leaves the central nervous system profoundly vulnerable to compounding head trauma,
    promoting matching Tier 2 blows directly into Tier 3 Severe Concussion.

- name: Cracked Ribs
  severity: 2
  priority: 4
  tags:
    - physical
    - torso
    - injury
  vulnerable:
    - torso
    - exertion
    - positioning
  rules:
    - passive: Whenever you flip cards from your deck to defend, or perform an action with printed cost of 2 or higher, suffer 1 Fatigue.
    - task: Torso Splinting & Rest (Check {Blue} 30, Check {Red} 20; Time 2 weeks; Requires Clean Wraps) -> Remove this.
    - when removed: Place 1 `Minor Wound` in your expended pile.
  notes: >
    Clinical Basis: Simple non-displaced fracture of 1-2 ribs without hemothorax/pneumothorax. Deep thoracic expansion
    and heavy muscular engagement cause sharp pleuritic pain, penalizing heavy defenses and multi-card actions.
    Vulnerability: Fractured thoracic cage exposes the torso to Tier 3 penetrating chest trauma and respiratory collapse.

- name: Deep Laceration
  severity: 2
  priority: 4
  tags:
    - physical
    - bleeding
    - injury
  vulnerable:
    - bleeding
    - exertion
    - torso
  rules:
    - passive: Whenever you flip cards to defend, expend 1 additional card from the top of your deck.
    - action: Direct Compression (Place 1 card from hand on top of this to cover and suppress its passive. If you declare an Attack or Sprint, expend that card and resume the passive).
    - setback: "If you suffer a positioning or physical consequence while a card is on top of this, jarring impact breaks your compress: expend that card and resume the passive immediately."
    - task: Layered Wound Suturing (Check {Blue} 35; Time 1 hour; Cost Suture & Antiseptic; Requires Suture Kit) -> Remove this.
    - when removed: Place 1 `Minor Wound` in your expended pile.
  notes: >
    Clinical Basis: Deep muscular laceration penetrating subcutaneous fascia without major trunk arterial transection.
    Constant venous and capillary oozing demands active physical compression to prevent steady deck depletion.
    Vulnerability: Open deep vascular breach exposes bleeding and exertion to Tier 3 Arterial Hemorrhage.

- name: Terrified
  severity: 2
  priority: 4
  tags:
    - fear
    - mental
    - cognitive
  vulnerable:
    - fear
    - mental
    - positioning
  supersedes:
    - Afraid
    - Rattled Nerves
  redraw: If you already have this condition in play, the attacker may redraw this candidate at the same tier.
  rules:
    - passive: You must expend 2 cards from hand to declare an Attack; you cannot willingly move closer to a foe.
    - action: Desperate Rally (Spend {Red} 35) -> Downgrade to `Afraid` (Severity 1).
    - when downgraded (via Action): Place 2 `Fatigue` on top of your deck.
    - task: Guided Calming & Pastoral Counseling (Check {Blue} 30; Time 1 hour) -> Remove this.
  notes: >
    Psychiatric Basis: Severe acute panic reaction. Prefrontal cortical control is overwhelmed by sympathetic hyper-arousal,
    requiring massive conscious effort (2 cards expended) to initiate aggressive action.
    In combat, a desperate rally costs Red 35 and inflicts 2 Fatigue just to downgrade to Afraid; out of combat, 1 hour of
    calming pastoral counseling clears the panic.
    Vulnerability: Acute panic reaction collapses mental defenses, exposing fear and mental tags to Tier 3/4 catatonic collapse.

- name: Hamstrung
  severity: 2
  priority: 4
  tags:
    - physical
    - legs
    - bleeding
  vulnerable:
    - limbs
    - positioning
  rules:
    - passive: You cannot take Move actions. Whenever you are forced to move, suffer 1 Fatigue.
    - task: Suture & Bind Tendon (Check {Yellow} 35, Check {Blue} 30; Time 2 hours; Requires Suture Kit & Splint; Cost Antiseptic) -> Remove this.
    - when removed: Place 1 `Minor Wound` in your expended pile.
  notes: >
    Anatomical Basis: Partial transection or severe longitudinal tearing of the biceps femoris/semitendinosus muscle
    belly. The knee joint cannot achieve active flexion or bear sudden eccentric loads without excruciating pain.
    Requires 2 hours of surgical suturing and splinting out of combat.
    Vulnerability: Severely crippled lower limb kinetic chain leaves positioning and limbs vulnerable to Tier 3 collapse.

- name: Pyric Backdraft (Second-Degree Burn)
  severity: 2
  priority: 3
  tags:
    - arcane
    - fire
    - hands
  vulnerable:
    - fire
    - arcane
    - hands
  supersedes:
    - Singed Sleeves
  rules:
    - passive: You cannot declare {Blue} actions or wield items in your primary hand.
    - task: Debridement & Antiseptic Burn Dressing (Check {Blue} 35; Time 1 day; Cost Burn Salve & Clean Wraps; Requires Medical Kit) -> Remove this.
    - when removed: Place 1 `Minor Wound` in your expended pile.
  notes: >
    Thermodynamic / Clinical Basis: Second-degree thermal burn destroying the epidermis and damaging papillary dermis.
    Fluid-filled blisters and exposed dermal pain receptors prevent gripping weapons or executing somatic casting gestures.
    Requires 1 day of clinical burn management out of combat.
    Vulnerability: Thermal nerve damage exposes hands and arcane manipulation to further escalation.

# ==============================================================================
# TIER 3: SEVERE STRUCTURAL TRAUMA & CRITICAL EMERGENCIES
# ==============================================================================

- name: Broken Arm (Colles' Fracture)
  severity: 3
  priority: 4
  tags:
    - physical
    - arms
    - injury
  vulnerable:
    - limbs
    - arms
    - exertion
  supersedes:
    - Strained Offense
  rules:
    - passive: You immediately drop any item held in that hand. You cannot wield two-handed weapons or shields.
    - passive: Whenever you perform an action with {Red} strength, suffer 2 Fatigue.
    - task: Orthopedic Reduction & Rigid Splinting (Check {Blue} 50, Check {Red} 35; Time 6 weeks; Requires Splint & Bone Cast Tools) -> Remove this.
    - when removed: Place 2 `Injury` cards in your expended pile.
  notes: >
    Orthopedic Basis: Complete transverse fracture of the distal radius/ulna. Total loss of structural skeletal integrity.
    Muscular contractions in the arm cause bone ends to grind against periosteal nerves, inducing systemic shock on heavy exertion.
    No in-combat action exists. Requires orthopedic bone setting and 6 weeks of immobilization out of combat.
    Vulnerability: Compounding Tier 3 trauma to an already fractured limb causes acute neurogenic shock, promoting directly
    to Tier 4 (Taken Out / Incapacitation).

- name: Arterial Hemorrhage
  severity: 3
  priority: 5
  tags:
    - physical
    - bleeding
  vulnerable:
    - bleeding
    - exertion
    - torso
  rules:
    - passive: At the start of each Crisis Time round, place 1 `Blood Loss` status card into your active hand.
    - action: Hold Direct Pressure (Place 2 cards from your hand on top of this to cover and suppress its passive. If you declare an Attack or Sprint, expend those cards and resume the passive).
    - setback: "If you suffer a positioning or physical consequence while cards are on top of this, jarring impact breaks your compress: expend those cards and resume the passive immediately."
    - task: Deep Cavity Packing & Suture (Check {Blue} 55, Check {Yellow} 35; Time 3 hours; Requires Surgical Kit; Cost Suture & Antiseptic) -> Remove this.
    - when removed: Place 2 `Injury` cards in your expended pile.
  notes: >
    Clinical Basis: Class II/III Hemorrhage (15–30% blood loss) through deep vascular laceration or arterial branch puncture.
    Ongoing internal bleeding steadily dilutes the active hand with urgent physiological distress cards.
    In combat, placing 2 cards on top of this card covers the text and suppresses blood loss so long as you don't swing
    a weapon or run; jarring impacts break the hold.
    Vulnerability: Compounding Tier 3 vascular trauma promotes directly to Tier 4 Mortal Bleedout (Exsanguination).

- name: Severe Concussion
  severity: 3
  priority: 5
  tags:
    - cognitive
    - sensory
    - head
  vulnerable:
    - head
    - cognitive
    - sensory
  supersedes:
    - Mild Concussion
    - Dazed
  redraw: If you already have this condition in play, the attacker may redraw this candidate at the same tier.
  rules:
    - passive: You cannot hold more than 3 cards in your hand. (Immediately expend excess cards from hand).
    - passive: You cannot declare {Blue} actions.
    - task: Clinical Neurological Convalescence (Check {Blue} 50; Time 2 weeks; Requires Darkened Infirmary) -> Remove this.
    - when removed: Replace with `Mild Concussion` (Severity 2).
  notes: >
    Neurological Basis: Grade III cerebral concussion with profound axonal strain, vestibulo-ocular disruption,
    nausea, and severe retrograde amnesia. Hand capacity is severely degraded to 3 cards; complex intellectual/magical
    planning is blocked.
    Vulnerability: Profound central nervous disruption means any subsequent Tier 3 cranial impact promotes directly to
    Tier 4 Unconscious (Traumatic Coma).

# ==============================================================================
# TIER 4: CLIMAX & DEFEAT 
# The Tier 4 physical deck hosts definitive combat exit states, trauma comas,
# and high-tension emergency crisis clocks (e.g. Mortal Bleedout) with ally
# intervention actions and legendary clinical resuscitation tasks.
# ==============================================================================

- name: Unconscious (Traumatic Coma)
  severity: 4
  priority: 5
  tags:
    - physical
    - head
    - cognitive
    - fatal
  rules:
    - passive: You are completely unconscious and out of the fight. You cannot take actions, hold cards in hand, or defend.
    - task: Intensive Trauma Resuscitation (Check {Blue} 85; Time 1 day; Requires Surgery Suite; Cost Life-Support Elixirs) -> Stabilized; awakens in 1d6 days with `Severe Concussion` (Severity 3).
  notes: >
    Clinical Basis: Reticular Activating System (RAS) suppression due to massive blunt force cranial acceleration,
    hypoxia, or severe metabolic shock. The character is completely incapacitated and at the mercy of the scene.
    Stabilization takes 1 day of clinical intensive care out of combat.
    Terminal: No further escalation or vulnerability tags.

- name: Mortal Bleedout (Exsanguination)
  severity: 4
  priority: 5
  tags:
    - physical
    - bleeding
    - critical
    - fatal
  rules:
    - passive: You collapse into hemorrhagic shock. You cannot act or defend. If not stabilized within 3 rounds (or 5 minutes), the character dies.
    - action: Ally Emergency Hemostasis (An adjacent ally places 2 cards from their hand on top of this to cover this card. As long as those cards remain on top of this, the bleedout round timer is paused).
    - task: Emergency Arterial Clamp & Transfusion (Check {Blue} 85, Check {Yellow} 65; Time 1 min; Requires Hemostatic Clamps; Cost Blood/Plasma Transfusion) -> Stabilize and replace with `Arterial Hemorrhage` (Severity 3).
  notes: >
    Clinical Basis: Class IV Hemorrhage (>40% blood volume loss) from transection of major arterial trunks (femoral,
    brachial, carotid). Mean arterial pressure drops below critical perfusion thresholds, leading to irreversible
    cellular hypoxia and cardiac arrest within minutes.
    In combat, an ally can place 2 cards over the card to physically cover the bleedout text and pause the timer;
    out of combat, a 1-minute emergency arterial clamp stabilizes the character at Severity 3.
    Terminal: No further escalation or vulnerability tags.

- name: Mind Void (Catatonic Shatter)
  severity: 4
  priority: 5
  tags:
    - mental
    - cognitive
    - arcane
    - fatal
  rules:
    - passive: The character's mind is completely severed from reality by arcane backdraft or eldritch trauma. You are non-responsive and out of the fight.
    - task: Planar Mind-Mending Ritual (Check {Blue} 90; Time 1 month; Requires Sanctified Temple; Cost Rare Astral Reagents) -> Downgrade to `Afraid` (Severity 1).
  notes: >
    Psychiatric / Arcane Basis: Complete psychogenic catatonia or psychic ego dissolution. The character's sensory
    integration networks are unresponsive to external stimuli; physically intact but cognitively absent.
    Requires a 1-month ritual quest to restore the character's psyche.
    Terminal: No further escalation or vulnerability tags.
