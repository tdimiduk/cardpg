# ==============================================================================
# NON-COMBAT & DOMAIN TABLE CARDS (EXAMPLE DOMAIN POOL EXPANSIONS)
# ==============================================================================

- name: Silver Tongue
  tags:
    - Trait
    - social
    - rhetoric
  rules:
    - passive: Your consequence pool size against social friction and composure attacks is 3.
    - action: Deflect Faux Pas (Spend {Yellow} 15) -> Suppress an active social condition until the end of the scene.
  notes: >
    Example domain table card. In social encounters, characters without relevant skills/standing
    fall back to base Pool Size 2. 'Silver Tongue' provides an expanded drafting pool (N = 3)
    allowing the character to soak social missteps or filter out scandal.
