design_process_and_research:
  inspiration_library:
    - name: "Inspiration Sources"
      id: "inspiration-sources"
      path: "research/inspiration-sources.yaml"
      source_type: "local_file"
      purpose: "A curated library of media (books, games, films) and their key design lessons."
      type: "Inspiration Library"
      status: "Canon"
      tags: ["doc-type:content-library", "audience:designer-facing", "core-concept:inspiration"]
  factual_bedrock:
    - name: "Verisimilitude Sources"
      id: "verisimilitude-sources"
      path: "research/verisimilitude-sources.yaml"
      source_type: "local_file"
      purpose: "A list of historical and scientific sources used to ground the game in casual realism."
      type: "Factual Bedrock"
      status: "Canon"
      tags: ["doc-type:content-library", "audience:designer-facing", "core-concept:verisimilitude", "core-concept:research"]
  research_reports:
    - name: "Battlefield Injury Research"
      id: "report-battlefield-injury"
      type: "Research Report"
      status: "Canon"
      purpose: "A detailed analysis of pre-modern battlefield trauma, its functional impacts, and progression. Used for designing injury, death, and healing mechanics."
      tags: ["doc-type:research-report", "audience:designer-facing", "core-concept:harm", "core-concept:injury", "core-concept:healing", "core-concept:lethality", "core-concept:verisimilitude"]
      components: { report_file: "research/reports/pre-modern_battlefield_injury/report.md", meta_file: "research/reports/pre-modern_battlefield_injury/meta.yaml", prompt_file: "research/reports/pre-modern_battlefield_injury/prompt.md" }
    - name: "Decline Under Physical Hardship"
      id: "report-physical-hardship"
      type: "Research Report"
      status: "Canon"
      purpose: "A scientific analysis of how real-world injuries and hardship affect the human body, providing a factual basis for the game's consequence and harm mechanics."
      tags: ["doc-type:research-report", "audience:designer-facing", "core-concept:hardship", "core-concept:attrition", "core-concept:injury", "core-concept:fatigue", "core-concept:verisimilitude"]
      components: { report_file: "research/reports/functional-decline-under-physical-hardship/report.md", meta_file: "research/reports/functional-decline-under-physical-hardship/meta.yaml", prompt_file: "research/reports/functional-decline-under-physical-hardship/prompt.md" }
    - name: "Catastrophic Trauma Timelines"
      id: "report-catastrophic-trauma"
      type: "Research Report"
      status: "Canon"
      purpose: "A quantitative analysis of the physiological timelines of death following catastrophic trauma. Provides a factual basis for designing high-severity consequences and 'dying' states with specific, evidence-based timers."
      tags: ["doc-type:research-report", "audience:designer-facing", "core-concept:harm", "core-concept:lethality", "core-concept:consequences", "core-concept:verisimilitude"]
      components: { report_file: "research/reports/catastrophic-trauma-timelines/report.md", meta_file: "research/reports/catastrophic-trauma-timelines/meta.yaml", prompt_file: "research/reports/catastrophic-trauma-timelines/prompt.md" }
    - name: "The Dynamics of the duel"
      id: "report-dynamics-of-duel"
      type: "Research Report"
      status: "Canon"
      purpose: "A detailed biomechanical and tactical analysis of pre-modern combat, focusing on physiological energy systems, fatigue, and the rhythm of a one-on-one engagement. Used for designing the pacing of Crisis Time."
      tags: ["doc-type:research-report", "audience:designer-facing", "pillar:combat", "core-concept:pacing", "core-concept:tempo", "core-concept:fatigue", "core-concept:verisimilitude"]
      components: { report_file: "research/reports/dynamics-of-the-duel/report.md", meta_file: "research/reports/dynamics-of-the-duel/meta.yaml", prompt_file: "research/reports/dynamics-of-the-duel/prompt.md" }
    - name: "Combat Dynamics Analysis"
      id: "report-combat-dynamics"
      type: "Research Report"
      status: "Canon"
      purpose: "A detailed tactical and mechanical analysis of pre-modern combat. Note: Its data on armor's metabolic cost and mobility penalties has been superseded by the more detailed 'report-combat-locomotion'."
      tags: ["doc-type:research-report", "audience:designer-facing", "pillar:combat", "core-concept:pacing", "core-concept:tempo", "core-concept:reach", "core-concept:spacing", "core-concept:armor", "core-concept:verisimilitude"]
      components: { report_file: "research/reports/combat-dynamics-analysis/report.md", meta_file: "research/reports/combat-dynamics-analysis/meta.yaml", prompt_file: "research/reports/combat-dynamics-analysis/prompt.md" }
    - name: "Combat Locomotion Analysis"
      id: "report-combat-locomotion"
      type: "Research Report"
      status: "Canon"
      purpose: "A detailed biomechanical analysis of pre-modern combat locomotion. Its findings on movement speeds and metabolic costs are the current authority and supersede data in 'report-combat-dynamics'."
      tags: ["doc-type:research-report", "audience:designer-facing", "pillar:combat", "core-concept:movement", "core-concept:fatigue", "core-concept:encumbrance", "core-concept:verisimilitude"]
      components: { report_file: "research/reports/combat-locomotion/report.md", meta_file: "research/reports/combat-locomotion/meta.yaml", prompt_file: "research/reports/combat-locomotion/prompt.md" }
    - name: "Combat Action Time Lexicon"
      id: "report-combat-action-time"
      type: "Research Report"
      status: "Canon"
      purpose: "A quantitative lexicon of the time costs, in seconds, for discrete pre-modern combat actions, including ranged attacks, movement, and weapon handling. Used for designing the game's action economy and the pacing of Crisis Time."
      tags: ["doc-type:research-report", "audience:designer-facing", "pillar:combat", "core-concept:pacing", "core-concept:tempo", "core-concept:action-resolution", "core-concept:verisimilitude"]
      components: { report_file: "research/reports/combat-action-time/report.md", meta_file: "research/reports/combat-action-time/meta.yaml", prompt_file: "research/reports/combat-action-time/prompt.md" }
    - name: "Metabolic Cost of Armor"
      id: "report-metabolic-cost-armor"
      type: "Research Report"
      status: "Canon"
      purpose: "A deep-dive research report on the metabolic and biomechanical costs of wearing replica medieval armor, providing quantitative multipliers for plate and maille."
      tags: ["doc-type:research-report", "audience:designer-facing", "pillar:combat", "core-concept:armor", "core-concept:encumbrance", "core-concept:fatigue", "core-concept:verisimilitude"]
      components: { report_file: "research/reports/metabolic-cost-of-armor/report.md", meta_file: "research/reports/metabolic-cost-of-armor/meta.yaml", prompt_file: "research/reports/metabolic-cost-of-armor/prompt.yaml" }
    - name: "Exertion and Recovery Dynamics"
      id: "report-exertion-recovery"
      type: "Research Report"
      status: "Canon"
      purpose: "A quantitative analysis of the physiological dynamics of exertion, stress, and multi-stage recovery. Provides a factual basis for designing mechanics related to fatigue, attrition, and the cumulative cost of hardship."
      tags: ["doc-type:research-report", "audience:designer-facing", "core-concept:fatigue", "core-concept:hardship", "core-concept:attrition", "core-concept:consequences", "core-concept:verisimilitude"]
      components: { report_file: "research/reports/exertion-recovery-dynamics/report.md", meta_file: "research/reports/exertion-recovery-dynamics/meta.yaml", prompt_file: "research/reports/exertion-recovery-dynamics/prompt.md" }
    - name: "Positional Advantage"
      id: "report-positional-advantage"
      type: "Research Report"
      status: "Canon"
      purpose: "A biomechanical, perceptual, and cognitive analysis of positional advantage in pre-modern melee. Used for designing mechanics related to facing, angular attacks, and multi-combatant engagements."
      tags: ["doc-type:research-report", "audience:designer-facing", "pillar:combat", "core-concept:movement", "core-concept:spacing", "core-concept:perception", "core-concept:verisimilitude"]
      components: { report_file: "research/reports/positional-advantage/report.md", meta_file: "research/reports/positional-advantage/meta.yaml", prompt_file: "research/reports/positional-advantage/prompt.md" }
  research_synthesis:
    - name: "Factual Basis for Design: The Armor Tradeoff"
      id: "synthesis-armor"
      path: "research/synthesis/armor.md"
      source_type: "local_file"
      purpose: "A synthesis of research on historical armor, analyzing the fundamental tradeoff between protection and the physiological costs of exertion (metabolic energy, mobility, and fatigue). It provides a factual basis for designing armor mechanics."
      type: "Research Synthesis"
      status: "Canon"
      tags: ["doc-type:research-synthesis", "audience:designer-facing", "core-concept:armor", "core-concept:encumbrance", "core-concept:fatigue", "core-concept:verisimilitude"]
    - name: "Factual Basis for Design: Tactical Movement & Positioning"
      id: "synthesis-tactical-movement"
      path: "research/synthesis/tactical-movement.md"
      source_type: "local_file"
      purpose: "A synthesis of research on historical combat locomotion, providing a factual basis for designing mechanics related to tactical movement, positioning, disengagement, and retreats. It also establishes the canonical vocabulary for tactical footwork (e.g., Passing Step, Traverse Step) that should be used in all related designs."
      type: "Research Synthesis"
      status: "Canon"
      tags: ["doc-type:research-synthesis", "audience:designer-facing", "pillar:combat", "core-concept:movement", "core-concept:spacing", "core-concept:disengagement", "core-concept:verisimilitude"]
    - name: "Factual Basis for Consequences: Physical Harm & Trauma"
      id: "synthesis-physical-harm"
      path: "research/synthesis/physical-harm-and-trauma.md"
      source_type: "local_file"
      purpose: "A synthesis of research reports on battlefield injuries and physical hardship, providing a factual basis for designing consequences related to physical harm. It maps real-world conditions to the game's severity levels."
      type: "Research Synthesis"
      status: "Canon"
      tags: ["doc-type:research-synthesis", "audience:designer-facing", "core-concept:harm", "core-concept:injury", "core-concept:consequences", "core-concept:verisimilitude"]
    - name: "Factual Basis for Consequences: Hardship & Exertion"
      id: "synthesis-hardship-and-exertion"
      path: "research/synthesis/hardship-and-exertion.md"
      source_type: "local_file"
      purpose: "A synthesis of research on the functional impact of physical hardship, providing a factual basis for designing consequences related to athletics, survival, and exploration. It maps real-world conditions to the game's severity levels."
      type: "Research Synthesis"
      status: "Canon"
      tags: ["doc-type:research-synthesis", "audience:designer-facing", "pillar:exploration", "core-concept:hardship", "core-concept:attrition", "core-concept:consequences", "core-concept:verisimilitude"]
    - name: "Factual Basis for Consequences: Catastrophic Trauma & Lethality"
      id: "synthesis-catastrophic-trauma"
      path: "research/synthesis/catastrophic-trauma-and-lethality.md"
      source_type: "local_file"
      purpose: "A detailed biomechanical and tactical analysis of pre-modern combat, focusing on physiological energy systems, fatigue, and the rhythm of a one-on-one engagement. Used for designing the pacing of Crisis Time."
      type: "Research Synthesis"
      status: "Canon"
      tags: ["doc-type:research-synthesis", "audience:designer-facing", "core-concept:harm", "core-concept:lethality", "core-concept:consequences", "core-concept:verisimilitude"]
    - name: "Summary: The Dynamics of the duel"
      id: "synthesis-dynamics-of-duel"
      path: "research/synthesis/dynamics-of-duel.md"
      source_type: "local_file"
      purpose: "Synthesizes the key findings from 'The Dynamics of the Duel' report into a concise summary of actionable design principles for combat pacing."
      type: "Research Synthesis"
      status: "Canon"
      tags: ["doc-type:research-synthesis", "audience:designer-facing", "pillar:combat", "core-concept:pacing", "core-concept:tempo", "core-concept:fatigue", "core-concept:verisimilitude"]
    - name: "Combat Spacing and Reach"
      id: "synthesis-combat-spacing"
      path: "research/synthesis/combat-spacing-and-reach.md"
      source_type: "local_file"
      purpose: "A synthesis of research on historical weapon lengths, armor, and fighting styles, providing a factual basis and reference table for modeling a combatant's tactical 'threat bubble' or area of control."
      type: "Research Synthesis"
      status: "Canon"
      tags: ["doc-type:research-synthesis", "audience:designer-facing", "pillar:combat", "core-concept:reach", "core-concept:spacing", "core-concept:movement", "core-concept:tempo", "core-concept:verisimilitude"]
    - name: "Combat Timelines and Tempos"
      id: "synthesis-combat-timelines"
      path: "research/synthesis/combat-timelines-and-tempos.md"
      source_type: "local_file"
      purpose: "A consolidated synthesis of research on the timescales of combat, providing reference tables for physiological phases, performance degradation, and the duration of discrete tactical actions (e.g., firing a bow, standing from prone)."
      type: "Research Synthesis"
      status: "Canon"
      tags: ["doc-type:research-synthesis", "audience:designer-facing", "pillar:combat", "core-concept:pacing", "core-concept:tempo", "core-concept:action-resolution", "core-concept:verisimilitude"]
  ideation:
    - name: "Design Sketchbook"
      id: "design-sketchbook"
      path: "iteration/design-sketchbook.md"
      source_type: "local_file"
      purpose: "A collection of specific mechanic ideas and explorations, look here to see if we have a good idea we just haven't formalized."
      type: "Ideation"
      status: "Canon"
      tags: ["doc-type:ideation", "audience:designer-facing"]
  archived_research:
    - name: "Armor Research"
      id: "synthesis-armor-old"
      path: "research/synthesis/armor-old.md"
      source_type: "local_file"
      purpose: "A specific research summary on historical armor, used for designing related mechanics."
      type: "Research Synthesis"
      status: "Archived"
      tags: ["doc-type:research-synthesis", "audience:designer-facing", "core-concept:armor", "core-concept:verisimilitude"]

