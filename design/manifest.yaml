# The Knowledge Manifest
#
# This file is the master index of the `cardpg` project's design landscape.
# It functions as a focused "knowledge map" for the Chronicler & Artificer AI.
# The AI uses this map to understand the project's design structure, from
# high-level philosophy to specific rules and content ideation.

knowledge_manifest:
  project_foundation:
    - name: "Guiding Principles"
      path: "design/philosophy/guiding-principles.md"
      source_type: "local_file"
      purpose: "The 'Why.' The ultimate authority on the project's creative vision and core philosophies."
      type: "Design Philosophy"
      status: "Canon"
    - name: "Design Precepts"
      path: "design/philosophy/design-precepts.md"
      source_type: "local_file"
      purpose: "The 'How-To.' Provides concrete design patterns and case studies for creating new mechanics."
      type: "Design Patterns"
      status: "Leading-Edge"

  game_system_and_rules:
    - name: "Core Rules"
      path: "design/rules/core-rules.md"
      source_type: "local_file"
      purpose: "The foundational player-facing rules. The single most important mechanics document."
      type: "Game Rules"
      status: "Canon"
    - name: "Gamemaster's Guide"
      path: "design/rules/gamemaster-guide.md"
      source_type: "local_file"
      purpose: "Instructions, best practices, and advanced guidance for running the game and writing adventures."
      type: "GM Procedures"
      status: "Canon"
    - name: "Colors of Action"
      path: "design/rules/colors-of-action.md"
      source_type: "local_file"
      purpose: "A extensive lexicon that to guide classifying actions in-game actions into Red, Yellow, or Blue."
      type: "Action Lexicon"
      status: "Canon"
    - name: "Clocks and Fronts"
      path: "design/rules/modules/clocks-and-fronts.md"
      source_type: "local_file"
      purpose: "Optional rules for dynamic campaign play."
      type: "Game Rules Module"
      status: "Canon"
    - name: "Snap Check"
      path: "design/rules/modules/snap-check.md"
      source_type: "local_file"
      purpose: "Optional rules for passive checks (like perception)."
      type: "Game Rules Module"
      status: "Canon"

  design_process_and_research:
    - name: "Inspiration Sources"
      path: "design/research/inspiration-sources.md"
      source_type: "local_file"
      purpose: "A curated library of media (books, games, films) and their key design lessons."
      type: "Inspiration Library"
      status: "Canon"
    - name: "Verisimilitude Sources"
      path: "design/research/verisimilitude-sources.md"
      source_type: "local_file"
      purpose: "A list of historical and scientific sources used to ground the game in casual realism."
      type: "Factual Bedrock"
      status: "Canon"
    - name: "Armor Research"
      path: "design/research/armor-research.md"
      source_type: "local_file"
      purpose: "A specific research summary on historical armor, used for designing related mechanics."
      type: "Research Summary"
      status: "Canon"
    - name: "Design Sketchbook"
      path: "design/iteration/design-sketchbook.md"
      source_type: "local_file"
      purpose: "A collection of specific mechanic ideas and explorations, look here to see if we have a good idea we just haven't formalized."
      type: "Ideation"
      status: "Canon"

  game_content_design:
    - name: "Consequence Decks"
      path: "https://docs.google.com/spreadsheets/u/0/d/1H49JzTbhXSZzbtooRIRm5wj3Kd9GD4Yq7xeztLDoRWU/edit"
      source_type: "google_sheet"
      purpose: "The primary spreadsheet for consequence card design."
      type: "Cards"
      status: "Canon"
      sheets:
        - name: "combat-general"
          purpose: "consequences cards for direct combat action or other physical harm."
          status: "Canon"
        - name: "task-general"
          purpose: "Contains consequences for non-combat tasks."
          status: "Canon"
        - name: "Conditions"
          purpose: "Lists ongoing status effects that characters can gain."
          status: "Archived"
    - name: "Cards - v 0.0.4"
      path: "https://docs.google.com/spreadsheets/u/0/d/1w6SvDr2nwZcXQDvsZ97F5IUh3D7vcjAcf-V40NYrolM/edit"
      source_type: "google_sheet"
      purpose: "Early playtesting character decks. Useful as few-shot examples for card structure."
      type: "Cards"
      status: "Archived"
    - name: "Monsters - v 0.0.4"
      path: "https://docs.google.com/spreadsheets/u/0/d/1_vBIPPSB4B2Y7_icIl3v2-iKZvIJRFEYM6kfAWTLSbQ/edit"
      source_type: "google_sheet"
      purpose: "Early playtesting monster decks. Useful as few-shot examples for monster design."
      type: "Cards"
      status: "Archived"
    - name: "Kid’s Campaign Characters"
      path: "https://docs.google.com/spreadsheets/u/0/d/1kN1ZZoWVXjpMAbjw0x33D6DWrHIYvVjaYM8qC-ViqYI/edit"
      source_type: "google_sheet"
      purpose: "Character decks from early playtest campaigns."
      type: "Cards"
      status: "Archived"
    - name: "Kids Events"
      path: "https://docs.google.com/spreadsheets/u/0/d/1XH0j1CNqiYYSc4hoSCuY-9dznPsv3ZiE2cg4UrSk2Q8/edit"
      source_type: "google_sheet"
      purpose: "Location, Travel and event cards from an early playtest campaign."
      type: "Cards"
      status: "Archived"
    - name: "Encounters (2025)"
      path: "https://docs.google.com/spreadsheets/d/1iIy53SLPovtR9VlpGvmtJ1Q8Vmv0cUyJEx83_0iE9WI/edit?gid=0#gid=0"
      source_type: "google_sheet"
      purpose: "Adventure decks from a recent playtest campaign, mostly up to date with current rules."
      type: "Cards"
      status: "Canon"
