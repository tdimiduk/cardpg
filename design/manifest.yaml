# The Knowledge Manifest
#
# This file is the master index of the `cardpg` project's design landscape.
# It functions as a focused "knowledge map" for the Chronicler & Artificer AI.
# The AI uses this map to understand the project's design structure, from
# high-level philosophy to specific rules and content ideation.

introductory_materials:
  - name: "Introduction"
    id: "introduction"
    path: "introduction.md"
    source_type: "local_file"
    purpose: "The primary player-facing introduction to the game. Sets the tone, theme, and core player experience before the rules are presented."
    type: "Introductory Text"
    status: "Canon"
    tags: ["doc-type:introductory-text", "audience:player-facing"]
  - name: "Root Readme"
    id: "readme-root"
    path: "README.md"
    source_type: "local_file"
    purpose: "The root orientation document for the repository."
    type: "Meta Document"
    status: "Canon"
    tags: ["doc-type:meta", "audience:designer-facing"]
  - name: "Research Readme"
    id: "readme-research"
    path: "research/README.md"
    source_type: "local_file"
    purpose: "Orientation for the research directory."
    type: "Meta Document"
    status: "Canon"
    tags: ["doc-type:meta", "audience:designer-facing"]

