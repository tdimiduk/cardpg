      source_type: "local_file"
      purpose: "A synthesis of research on historical armor, analyzing the fundamental tradeoff between protection and the physiological costs of exertion (metabolic energy, mobility, and fatigue). It provides a factual basis for designing armor mechanics."
      type: "Research Synthesis"
      status: "Canon"
      tags:
