# The Research Index
#
# This file is a sub-index of the `cardpg` project's design landscape,
# specifically mapping out empirical research reports, verisimilitude sources,
# and research syntheses.
#
# Refer to the root `design/index.yaml` for status definitions (Canon, Leading-Edge, Archived).

design_process_and_research:
  inspiration_library:
    - name: "Inspiration Sources"
      id: "inspiration-sources"
      path: "research/inspiration-sources.yaml"
      source_type: "local_file"
      purpose: "A curated library of media (books, games, films) and their key design lessons."
      type: "Inspiration Library"
      status: "Canon"
      tags:
        [
          "doc-type:content-library",
          "audience:designer-facing",
          "core-concept:inspiration",
        ]
  factual_bedrock:
    - name: "Verisimilitude Sources"
      id: "verisimilitude-sources"
      path: "research/verisimilitude-sources.yaml"
      source_type: "local_file"
      purpose: "A list of historical and scientific sources used to ground the game in casual realism."
      type: "Factual Bedrock"
      status: "Canon"
      tags:
        [
          "doc-type:content-library",
          "audience:designer-facing",
          "core-concept:verisimilitude",
          "core-concept:research",
        ]
  research_reports:
    - name: "Battlefield Injury Research"
      id: "report-battlefield-injury"
      type: "Research Report"
      status: "Canon"
      purpose: "A detailed analysis of pre-modern battlefield trauma, its functional impacts, and progression. Used for designing injury, death, and healing mechanics."
      tags:
        [
          "doc-type:research-report",
          "audience:designer-facing",
          "core-concept:harm",
          "core-concept:injury",
          "core-concept:healing",
          "core-concept:lethality",
          "core-concept:verisimilitude",
        ]
      components:
        {
          report_file: "research/reports/pre-modern_battlefield_injury/report.md",
          meta_file: "research/reports/pre-modern_battlefield_injury/meta.yaml",
          prompt_file: "research/reports/pre-modern_battlefield_injury/prompt.md",
        }
    - name: "Decline Under Physical Hardship"
      id: "report-physical-hardship"
      type: "Research Report"
      status: "Canon"
      purpose: "A scientific analysis of how real-world injuries and hardship affect the human body, providing a factual basis for the game's consequence and harm mechanics."
      tags:
        [
          "doc-type:research-report",
          "audience:designer-facing",
          "core-concept:hardship",
          "core-concept:attrition",
          "core-concept:injury",
          "core-concept:fatigue",
          "core-concept:verisimilitude",
        ]
      components:
        {
          report_file: "research/reports/functional-decline-under-physical-hardship/report.md",
          meta_file: "research/reports/functional-decline-under-physical-hardship/meta.yaml",
          prompt_file: "research/reports/functional-decline-under-physical-hardship/prompt.md",
        }
    - name: "Catastrophic Trauma Timelines"
      id: "report-catastrophic-trauma"
      type: "Research Report"
      status: "Canon"
      purpose: "A quantitative analysis of the physiological timelines of death following catastrophic trauma. Provides a factual basis for designing high-severity consequences and 'dying' states with specific, evidence-based timers."
      tags:
        [
          "doc-type:research-report",
          "audience:designer-facing",
          "core-concept:harm",
          "core-concept:lethality",
          "core-concept:consequences",
          "core-concept:verisimilitude",
        ]
      components:
        {
          report_file: "research/reports/catastrophic-trauma-timelines/report.md",
          meta_file: "research/reports/catastrophic-trauma-timelines/meta.yaml",
          prompt_file: "research/reports/catastrophic-trauma-timelines/prompt.md",
        }
    - name: "The Dynamics of the duel"
      id: "report-dynamics-of-duel"
      type: "Research Report"
      status: "Canon"
      purpose: "A detailed biomechanical and tactical analysis of pre-modern combat, focusing on physiological energy systems, fatigue, and the rhythm of a one-on-one engagement. Used for designing the pacing of Crisis Time."
      tags:
        [
          "doc-type:research-report",
          "audience:designer-facing",
          "pillar:combat",
          "core-concept:pacing",
          "core-concept:tempo",
          "core-concept:fatigue",
          "core-concept:verisimilitude",
        ]
      components:
        {
          report_file: "research/reports/dynamics-of-the-duel/report.md",
