document_purpose: >
  This is a designer-facing document intended for internal use.
  It serves as a curated library of "places to look" when brainstorming the kinds of stories,
  play styles, and mechanical concepts we want to support. By providing a shared pool of
  inspirational touchstones—including books, films, and other games—this document helps to
  establish a common creative vocabulary for the design team. It is a source of ideas,
  not a book of rules.
---
inspiration_by_design_goal:
  - goal: "Sources for Combat"
    sources:
      - sub_goal: "For Gritty, Technical Combat"
        titles:
          - "The Soulsborne Series & Nioh Series"
          - "Samurai Cinema"
          - "The Witcher Series"
      - sub_goal: "For Heroic, High-Powered Combat"
        titles:
          - "Exalted"
          - "Final Fantasy Series"
          - "The Wuxia Genre"
      - sub_goal: "For Tactical, Team-Based Combat"
        titles:
          - "Gloomhaven"
          - "Divinity: Original Sin 2"
          - "Dungeons & Dragons / Pathfinder"
          - "Might and Magic Series"
  - goal: "Sources for Exploration"
    sources:
      - sub_goal: "For Player-Driven Journeys"
        titles:
          - "Ironsworn"
          - "The Lord of the Rings"
          - "Red Dead Redemption 2"
          - "Avatar: The Last Airbender"
          - "Torchbearer"
          - "Might and Magic Series"
      - sub_goal: "For Non-Combat Problem Solving"
        titles:
          - "Mushishi"
          - "Disco Elysium"
          - "Thief: The Dark Project"
          - "Alien (1979)"
      - sub_goal: "For Environmental Storytelling"
        titles:
          - "The Soulsborne Series"
          - "Studio Ghibli Films"
          - "Diablo (1997)"
  - goal: "Sources for Social & Intrigue"
    sources:
      - sub_goal: "For Political & Dynastic Intrigue"
        titles:
          - "Crusader Kings"
          - "Dune"
          - "Romance of the Three Kingdoms"
          - "A Song of Ice and Fire"
      - sub_goal: "For Personal & Factional Intrigue"
        titles:
          - "World of Darkness Games"
          - "Blades in the Dark"
          - "The Tale of Genji"
          - "The Harry Potter Series"
          - "The Thing (1982)"
      - sub_goal: "For Structured Social Conflict"
        titles:
          - "Burning Wheel"
          - "Monsterhearts"
  - goal: "Sources for Downtime"
    sources:
      - sub_goal: "For Downtime Activities & Projects"
        titles:
          - "Blades in the Dark"
          - "Ars Magica"
          - "Red Dead Redemption 2"
          - "Torchbearer"
      - sub_goal: "For Generational Play & Legacy"
        titles:
          - "King Arthur Pendragon"
          - "Crusader Kings"
      - sub_goal: "For Faction & Base Building"
        titles:
          - "Water Margin"
          - "OSR Stronghold Building rules"
