document_purpose: >
  This is a designer-facing document intended for internal use.
  It serves as a living list and a starting point for our factual research.
  It contains an initial collection of high-quality historical, medical, and scientific sources
  that model the *kind* of evidence we should use to ground our design in "Casual Realism."
  Its purpose is to provide a shared factual basis for our mechanics and to grow over time
  as we discover new, relevant sources.
---
modeling_armor_weapons_combat:
  description: >
    Information on the effectiveness, construction, and historical context of different armor types.
  sources:
    primary_academic_museum:
      - type: article
        author: "A. Williams"
        title: '"The Knight and the Blast Furnace"'
        description: >
          Cited for quantitative data on the energy (in joules) required to penetrate different types of armor,
          particularly the surprising effectiveness of gambesons against cuts.
        vetting:
          - date: "2025-09-05"
            type: "AI-Assisted Initial Vetting"
            author: "Chronicler & Artificer"
            summary: "Source is the definitive academic work on the metallurgy and material science of historical armor. Author is the leading expert in the field. Highly recommended as a foundational source for modeling armor effectiveness."
      - type: organization
        organization: "The Wallace Collection, London"
        description: "Referenced for information on Gothic-style armor."
      - type: organization
        organization: "The Metropolitan Museum of Art"
        title: '"Arms and Armor in Medieval Europe"'
        description: "A general source for the evolution of armor from the early Middle Ages through the Renaissance."
      - type: manual_series
        title: "Fechtbücher (Combat Manuals) of Fiore dei Liberi, Hans Talhoffer, etc."
        description: >
          Primary sources for understanding the specific techniques used in armored combat (Harnischfechten),
          including grappling (Ringen), half-swording, and targeting gaps.
    primary_historical_manuals:
      - type: manual
        author: "Fiore dei Liberi"
        title: '"Il Fior di Battaglia" (The Flower of Battle)'
        description: >
          A foundational early 15th-century Italian manual detailing a complete, integrated martial arts system. It is an invaluable source for modeling a holistic approach to combat, covering abrazare (grappling), dagger, longsword, poleaxe, and mounted combat, both in and out of armor.
        vetting:
          - date: "2025-09-05"
            type: "confirmation"
            author: "tdimiduk"
            summary: "confirmed this is a primary source and cited correctly. Scans (in italian) are available at: https://wiktenauer.com/wiki/Fior_di_Battaglia_(MS_Ludwig_XV_13), translations at https://wiktenauer.com/wiki/Fiore_de%27i_Liberi"
      - type: manual
        author: "Filippo Vadi"
        title: '"De Arte Gladiatoria Dimicandi" (On the Art of Swordsmanship)'
        description: >
          A mid-15th-century Italian manual that builds upon the work of Fiore dei Liberi. It provides another key reference for the Italian school of arms, with a particular focus on the theory, geometry, and principles of the longsword.
      - type: manual_tradition
        tradition: "German School (Liechtenauer Tradition)"
        title: "Various Fechtbücher (e.g., MS 3227a, Hans Talhoffer, Joachim Meyer)"
        description: >
          A vast body of work from the 14th to 16th centuries based on the mnemonic verses of Johannes Liechtenauer. These manuals are our primary source for tactical concepts like the Vor, Nach, and Indes, the five "master cuts" (Meisterhäue), and the importance of the bind (Winden).
          - **Joachim Meyer (c. 1570):** A key late-period source notable for its systematic and pedagogical approach, providing a highly detailed lexicon of actions for longsword, dussack, and rapier.
      - type: manual
        author: "George Silver"
        title: '"Paradoxes of Defence"'
        description: >
          An English manual from 1599 that provides a critical perspective on the continental rapier systems, advocating for the effectiveness of the traditional English backsword. It is a valuable source for understanding the tactical principles of cut-and-thrust swordsmanship and the importance of measure (distance).
      - type: manual
        author: "Miyamoto Musashi"
        title: '"Go Rin no Sho" (The Book of Five Rings)'
        description: >
          A seminal 17th-century Japanese text on kenjutsu (swordsmanship) and martial strategy. While more philosophical than a step-by-step technical manual, it is an essential source for the psychological and strategic aspects of dueling, timing, and reading an opponent.
      - type: manual_tradition
        tradition: "Tenshin Shōden Katori Shintō-ryū"
        title: "Various Densho (Transmission Scrolls)"
        description: >
          One of the oldest extant classical Japanese martial traditions (koryū), founded in the 15th century. Its teachings, accessible through modern scholarship and legitimate practitioners, provide a comprehensive curriculum including swordsmanship (kenjutsu), staff techniques (bōjutsu), and halberd fighting (naginatajutsu), offering a non-European perspective on integrated weapon systems.
      - type: manual
        author: "Sun Tzu"
        title: '"The Art of War"'
        description: >
          The foundational ancient Chinese text on military strategy. While it does not detail specific martial techniques, its principles of assessment, deception, maneuver, and exploiting terrain are timeless and provide a crucial framework for modeling the tactical and strategic layers of conflict, perfectly informing Blue-colored actions.
      - type: manual
        author: "Qi Jiguang"
        title: '"Jixiao Xinshu" (New Treatise on Military Efficiency)'
        description: >
          A highly practical and influential 16th-century Ming Dynasty military manual. Written by a renowned general to train his soldiers, it is an invaluable source for combined-arms tactics (the "mandarin duck" formation), formation fighting, and the battlefield application of various weapons, including staff, sword, and early firearms. It also includes one of the earliest known detailed sections on unarmed fighting ("Essentials of the Fist").

    online_compilations_blogs:
      - type: website
        publication: "TheCollector.com"
        description: "For articles on the evolution of armor from maille to plate."
      - type: website
        publication: "A Collection of Unmitigated Pedantry (acoup.blog)"
        description: >
          For detailed analysis and myth-busting regarding the effectiveness of different armor types,
          particularly gambesons.
      - type: website
        publication: "Chivalry Today (chivalrytoday.com)"
        description: "For articles on the evolution of armor through different medieval periods."
      - type: community
        community: "myArmoury.com & r/AskHistorians, r/ArmsandArmor"
        description: >
          Community forums and subreddits used to find discussions from historical enthusiasts and amateur experts,
      - type: video
        creator: "BenjaminRose.com"
        title: "Mobility in Medieval Plate Armor"
        platform: "YouTube"
        url: "https://www.youtube.com/watch?v=qzTwBQniLSc"
        description: >
          A well-known video demonstrating the high degree of mobility possible in a well-fitted suit of plate armor, including running, climbing, and getting up from the ground unassisted. Excellent for debunking common myths about armor's cumbersomeness.     particularly regarding gambesons vs. blunt trauma and the effectiveness of swords.
      - type: video
        publication: "Medievalists.net"
        title: '"Can You Move in Armour?"'
        url: "https://www.youtube.com/watch?v=q-bnM5SuQkI"
        description: >
          Excellent short video citing primary historical sources (the chronicles of Boucicaut) to demonstrate the high degree of mobility and athleticism possible for a trained individual in a full plate harness. Directly supports the concept that the primary limitations of plate armor are fatigue and endurance, not inflexibility.
      - type: website
        publication: "Wiktenauer"
        url: "https://wiktenauer.com"
        description: >
          The largest and most comprehensive online library of Historical European Martial Arts (HEMA) books and manuscripts. An indispensable primary and secondary source for historical combat techniques, principles, and traditions.
        vetting:
          - date: "2025-09-05"
            type: "AI-Assisted Initial Vetting"
            author: "Chronicler & Artificer"
            summary: "Source is the definitive online repository for primary HEMA sources, managed by the reputable HEMA Alliance. Highly recommended as a foundational research tool."
    biomechanics_and_trauma:
      - type: governmental_standard
        title: "Criteria for a Recommended Standard: Occupational Noise Exposure"
        author: "CDC / NIOSH"
        year: 1998
        doi_or_url: "https://stacks.cdc.gov/view/cdc/5923/cdc_5923_DS1.pdf"
        local_archive: "sources/verisimilitude/niosh-1998-occupational-noise-exposure-criteria"
        epistemic_grade: "governmental_standard"
        description: >
          Definitive federal standard on acute and chronic acoustic trauma. Details how near-field blast overpressure and impulse impacts exceeding 140 dB SPL cause mechanical shearing of cochlear stereocilia and metabolic hair cell exhaustion, inducing acute temporary threshold shifts (TTS) and subjective tinnitus resolving over 24–72 hours.
        vetting:
          - date: "2026-09-17"
            type: "empirical literature verification"
            author: "Gemini 3.8 Flash (Antigravity)"
            summary: "Authoritative federal acoustic trauma standard establishing decibel thresholds for stereocilia damage and acute tinnitus duration."
      - type: clinical_chapter
        title: "Cervical Acceleration-Deceleration (Whiplash) Injury"
        author: "Panjabi, M. M., et al. / StatPearls"
        year: 2023
        doi_or_url: "https://www.ncbi.nlm.nih.gov/books/NBK546644/"
        local_archive: "sources/verisimilitude/statpearls-2023-cervical-whiplash-biomechanics"
        epistemic_grade: "clinical_dataset"
        description: >
          Clinical biomechanics chapter on cervical acceleration-deceleration trauma resulting from rapid blunt impacts to helmets or shields. Quantifies mechanical strain on cervical facet capsular ligaments, myofascial micro-tears in sternocleidomastoid and trapezius, delayed muscle spasms peaking at 12–24 hours, and 3–6 week functional recovery curves.
        vetting:
          - date: "2026-09-17"
            type: "empirical literature verification"
            author: "Gemini 3.8 Flash (Antigravity)"
            summary: "Definitive clinical and biomechanical treatise on cervical whiplash kinematic injury, delayed spasm onset, and progressive recovery."
---
modeling_physical_costs_of_effort:
  description: >
    Covers the real-world physical impact of combat and sustained alertness.
  sources:
    primary_scientific_journals_concepts:
      - type: journal
        publication: "Proceedings of the Royal Society B: Biological Sciences"
        description: >
          Specifically for the 2011 study on the metabolic cost of locomotion in medieval armor,
          which provided the "more than double the energy cost" statistic and highlighted the respiratory strain
          of wearing a helmet.
      - type: concept
        concept: "ATP-PCr (Phosphagen) System"
        description: >
          The core physiological concept used to analyze the fatigue from short, explosive bursts of activity
          (like a 20-second combat round).
      - type: concept
        concept: "Anaerobic Glycolysis"
        description: >
          The physiological concept for analyzing fatigue from sustained, high-intensity work lasting around a minute
          (like the "archer" or "kata" scenario).
      - type: journal_article
        author: "Askew, G. N., Formenti, F., & Minetti, A. E."
        title: "Limitations imposed by wearing armour on Medieval soldiers' locomotor performance"
        publication: "Proceedings of the Royal Society B: Biological Sciences"
        year: 2012
        volume: 279
        issue: 1729
        pages: "640-644"
        doi: "10.1098/rspb.2011.0816"
        description: >
          The definitive scientific study quantifying the increased energy cost of walking and running in a replica of 15th-century Gothic plate armor. Provides the key data points that locomotion in armor is ~2x more energetically expensive than unloaded movement.

    modern_military_psychological_research:
      - type: research_field
        title: "Studies on Soldier Load and Metabolic Cost"
        description: >
          Research on modern infantry used as an analogue for understanding the energy expenditure of carrying heavy gear
          for long periods.
      - type: concept
        concept: "Vigilance Decrement"
        description: >
          The psychological principle explaining the degradation of attention and perception during long periods of
          high-alertness (like a 6-hour patrol).
      - type: concept
        concept: "Stress Hormones (Cortisol, Adrenaline)"
        description: >
          Used to analyze the physiological cost of hypervigilance and the "crash" that follows a prolonged period of stress.
