# Foundational Scientific & Medical Sources (Cited in Reports)
foundational_scientific_medical:
  description: >
    Key peer-reviewed academic and clinical sources that are frequently cited in the project's research reports.
    These provide the core quantitative data for modeling physiology, trauma, and the physical costs of exertion.
  sources:
    - type: journal_article
      title: "Limitations imposed by wearing armour on Medieval soldiers' locomotor performance"
      author: "Askew, G. N., Formenti, F., & Minetti, A. E."
      year: 2012
      doi_or_url: "https://doi.org/10.1098/rspb.2011.0816"
      epistemic_grade: "primary_academic"
      publication: "Proceedings of the Royal Society B: Biological Sciences"
      description: >
        The definitive scientific study quantifying the increased energy cost of walking and running in a replica 15th-century plate harness. This is the primary source for the ~2.2x metabolic cost multiplier for plate armor, a foundational piece of data for the game's fatigue and encumbrance mechanics.
      vetting:
        - date: "2025-09-05"
          type: "existence check"
          author: "tdimiduk"
          summary: "confirmed that the article exists at https://royalsocietypublishing.org/doi/epdf/10.1098/rspb.2011.0816 and it's abstract contains the numbers we cite"
    - type: journal_article
      title: "Range of motion and energy cost of locomotion of the late medieval armoured fighter"
      author: "Jaquet, D., et al."
      year: 2016
      doi_or_url: "https://doi.org/10.1080/01615440.2015.1112753"
      epistemic_grade: "primary_academic"
      publication: "Historical Methods: A Journal of Quantitative and Interdisciplinary History"
      description: >
        A critical counterpoint study to Askew et al. (2012) that used a single, high-fidelity, tailor-made harness. It provides the ~1.7x metabolic cost multiplier for "masterwork" armor and confirms that a well-fitted harness imposes minimal restrictions on range of motion, reinforcing that armor's primary cost is endurance, not mobility.
      vetting:
        - date: "2025-09-05"
          type: "existence check"
          author: "tdimiduk"
          summary: "confirmed that the article exists at https://www.tandfonline.com/doi/abs/10.1080/01615440.2015.1112753 and it's abstract is relevant"
    - type: government_report
      title: "Understanding the Physiological, Biomechanical, and Performance Effects of Body Armor Use (Technical Report ADA504354)"
      author: "U.S. Army Research Institute of Environmental Medicine"
      year: 2008
      doi_or_url: "https://apps.dtic.mil/sti/tr/pdf/ADA504354.pdf"
      local_archive: "sources/verisimilitude/us-army-2008-body-armor-effects-ada504354.pdf"
      epistemic_grade: "primary_academic"
      description: >
        A foundational modern military study on load carriage. It provides the critical quantitative data that adding weight to the feet is 4 to 6 times more energetically costly than adding it to the torso, which is the key biomechanical explanation for the high metabolic cost of full-body plate armor.
      vetting:
        - date: "2025-09-05"
          type: "quick scan"
          author: "tdimiduk"
          summary: "confirmed that the report exists at https://apps.dtic.mil/sti/tr/pdf/ADA504354.pdf and conclusions seem in line with what we derived"
    - type: medical_textbook_chapter
      title: "Impact of Hemorrhage on Trauma Outcomes: An Overview of Epidemiology, Clinical Presentations, and Therapeutic Considerations"
      author: "Kauvar, D. S., Lefering, R., & Wade, C. E."
      year: 2006
      doi_or_url: "https://doi.org/10.1097/01.ta.0000199961.03377.f5"
      epistemic_grade: "clinical_dataset"
      publication: "Journal of Trauma and Acute Care Surgery"
      description: >
        A key clinical review article that provides the quantitative framework for the four classes of hemorrhagic shock. This source is the factual basis for modeling the progressive physical and cognitive decline from blood loss, directly informing the severity levels of "Bleeding" consequences.
    - type: journal_article
      title: "The Biology of Human Starvation"
      author: "Keys, A., Brožek, J., Henschel, A., Mickelsen, O., & Taylor, H. L."
      year: 1950
      doi_or_url: "https://www.upress.umn.edu/book-division/books/the-biology-of-human-starvation"
      epistemic_grade: "clinical_dataset"
      publication: "University of Minnesota Press"
      description: >
        The definitive study on the physiological and psychological effects of long-term calorie restriction (the "Minnesota Starvation Experiment"). It is the primary source for understanding the profound cognitive impacts of starvation, such as apathy and obsessive focus, which precede total physical collapse.
    - type: journal_article
      title: "The physiological consequences of strangulation..."
      author: "Gaw, R., et al."
      year: 2021
      doi_or_url: "https://doi.org/10.1007/s12024-021-00366-z"
      epistemic_grade: "primary_academic"
      publication: "Forensic Science, Medicine and Pathology"
      description: >
        A forensic pathology study that provides the highly precise timeline for strangulation, establishing that loss of consciousness occurs in approximately 6.8 seconds. This is a key data point for modeling the hyper-acute effects of asphyxiation and cerebral hypoxia.
    - type: journal_article
      title: "Studies on Cognitive Performance during Prolonged Load Carriage"
      author: "Various"
      doi_or_url: "https://academic.oup.com/milmed"
      epistemic_grade: "secondary_analysis"
      publication: "Military Medicine"
      description: >
        Represents a cluster of modern military studies analyzing the effects of fatigue from forced marches on cognitive function. These sources provide the quantitative data on the decline of working memory, vigilance, and executive function, forming the basis for cognitive consequences related to exploration and exhaustion.
    - type: journal_article
      title: "The initial responses to cold-water immersion in man"
      author: "Tipton, M. J."
      year: 1989
      doi_or_url: "https://doi.org/10.1042/cs0770581"
      epistemic_grade: "primary_academic"
      publication: "Clinical Science"
      description: >
        A foundational paper on the "cold shock" response. It provides the physiological explanation and timeline for the involuntary gasp and hyperventilation that occur in the first few minutes of cold water immersion, which are the primary cause of drowning long before hypothermia sets in.
    - type: journal_article
      title: "Tactical Combat Casualty Care in Special Operations"
      author: "Butler, F. K., Hagmann, J., & Butler, E. G."
      year: 1996
      doi_or_url: "https://academic.oup.com/milmed/article/161/suppl_8/3/4844399"
      epistemic_grade: "clinical_dataset"
      publication: "Military Medicine"
      description: >
        The seminal paper that introduced the TCCC guidelines. It serves as a primary source for understanding the principles of modern trauma care (e.g., tourniquets, hemostatic agents, chest seals), which in turn provides a logical framework for designing plausible magical or advanced healing mechanics.
    - type: book
      title: "The Knight and the Blast Furnace: A History of the Metallurgy of Armour in the Middle Ages & the Early Modern Period"
      author: "Williams, A."
      year: 2003
      doi_or_url: "https://brill.com/display/title/8657"
      epistemic_grade: "primary_academic"
      publication: "Brill"
      description: >
        An essential text on the material science of historical armor. It provides the quantitative data (in joules) on the energy required to penetrate different types of armor, confirming that sword cuts are physically incapable of defeating steel plate and providing a factual basis for the game's weapon vs. armor interaction model.
---
modeling_logistics_transport_materials:
  description: >
    Empirical, agricultural, historical, and veterinary literature supporting logistics, transport, material degradation, and animal husbandry.
  sources:
    - type: historical_manual
      title: "Harness Making"
      author: "Hasluck, P. N."
      year: 1904
      doi_or_url: "https://archive.org/details/harnessmaking00hasl"
      local_archive: "sources/verisimilitude/hasluck-1904-harness-making.pdf"
      epistemic_grade: "historical_manual"
      description: >
        Comprehensive historical craft treatise detailing harness makers' tools, leather tensile preparation, buckle tongues, oval punches, stitching techniques, and field repair methods for draft and pack harness straps under cyclic load.
      vetting:
        - date: "2026-09-17"
          type: "empirical literature verification"
          author: "Gemini 3.8 Flash (Antigravity)"
          summary: "Authoritative historical reference on leather strap failure points, buckle tear stress, and field stitching/repair timelines for working harness."
    - type: government_report
      title: "Water Activity (aw) in Foods"
      author: "Food and Drug Administration (FDA)"
      year: 1984
      doi_or_url: "https://www.fda.gov/inspections-compliance-enforcement-and-criminal-investigations/inspection-technical-guides/water-activity-aw-foods"
      local_archive: "sources/verisimilitude/fda-1984-water-activity-in-foods.md"
      epistemic_grade: "primary_academic"
      description: >
        Technical inspection guide defining sorption isotherms, water activity measurement (a_w = ERH/100), and microbial proliferation thresholds. Establishes a_w >= 0.70 as the critical activation boundary for xerophilic molds (Aspergillus, Penicillium) and a_w >= 0.85 for rapid bacterial and low-acid food spoilage.
      vetting:
        - date: "2026-09-17"
          type: "empirical literature verification"
          author: "Gemini 3.8 Flash (Antigravity)"
          summary: "Definitive physical science baseline for moisture-driven food degradation, sorption curves, and fungal germination limits on dry rations."
    - type: historical_manual
      title: "A Treatise on Ropemaking as Practised in Public and Private Rope-Yards"
      author: "Chapman, R."
      year: 1868
      doi_or_url: "https://library.si.edu/digital-library/book/treatiseonropema00chap"
      local_archive: "sources/verisimilitude/chapman-1868-treatise-on-ropemaking.pdf"
      epistemic_grade: "historical_manual"
      description: >
        Master ropemaker's technical manual providing quantitative breaking strain formulas, weight tables, and friction wear dynamics for natural hemp (Cannabis sativa) cordage, shroud hawsers, and animal draft tethers, detailing fiber fatigue and splicing recovery methods.
      vetting:
        - date: "2026-09-17"
          type: "empirical literature verification"
          author: "Gemini 3.8 Flash (Antigravity)"
          summary: "Historical engineering benchmark documenting tensile failure curves, tarring effects, and structural strand unlaying under cyclic livestock traction."
    - type: journal_article
      title: "Marine Atmospheric Corrosion of Carbon Steel: A Review"
      author: "Alcántara, J., de la Fuente, D., Chico, B., Simancas, J., Díaz, I., & Morcillo, M."
      year: 2017
      doi_or_url: "https://doi.org/10.3390/ma10040406"
      local_archive: "sources/verisimilitude/alcantara-2017-marine-atmospheric-corrosion-carbon-steel.md"
      epistemic_grade: "primary_academic"
      publication: "Materials"
      description: >
        Comprehensive review of atmospheric corrosion mechanisms for carbon steel and ferrous alloys under varying relative humidity (critical RH 60–80%) and chloride deposition. Details rust phase formation (lepidocrocite, goethite, akaganeite), 4–6x rust volumetric expansion leading to mechanical hinge/pin seizure, and penetration rates ranging from 10–25 um/year inland to >200 um/year in marine environments.
      vetting:
        - date: "2026-09-17"
          type: "empirical literature verification"
          author: "Gemini 3.8 Flash (Antigravity)"
          summary: "Rigorous metallurgical data establishing electrochemical oxidation rates, humidity thresholds for rust film formation, and mechanical seizure dynamics of ferrous gear."
    - type: extension_bulletin
      title: "Horse Hoof Abscesses: Causes, Signs and Treatment"
      author: "Martinson, K."
      year: 2023
      doi_or_url: "https://extension.umn.edu/horse-health/horse-hoof-abscesses"
      local_archive: "sources/verisimilitude/umn-extension-2023-horse-hoof-abscesses.md"
      epistemic_grade: "primary_academic"
      publication: "University of Minnesota Extension"
      description: >
        Clinical veterinary extension guide on equine subsolar pododermatitis (hoof abscesses). Details anaerobic bacterial infiltration through the water-softened white line during prolonged wet terrain traversal, pressure build-up within the rigid keratin hoof capsule, acute non-weight-bearing lameness, surgical paring for ventral drainage, antiseptic poulticing, and the 7–14 day clinical recovery curve.
      vetting:
        - date: "2026-09-17"
          type: "empirical literature verification"
          author: "Gemini 3.8 Flash (Antigravity)"
          summary: "Authoritative clinical reference on equine foot pathology, environmental softening factors, and treatment/drainage timelines for pack beasts."
    - type: extension_bulletin
      title: "Aspergillus Ear Rot (BP-83-W)"
      author: "Woloshuk, C., & Wise, K."
      year: 2010
      doi_or_url: "https://www.extension.purdue.edu/extmedia/bp/bp-83-w.pdf"
      local_archive: "sources/verisimilitude/woloshuk-2010-purdue-aspergillus-ear-rot.pdf"
      epistemic_grade: "primary_academic"
      publication: "Purdue University Extension"
      description: >
        Agricultural post-harvest pathology bulletin documenting fungal colonization (Aspergillus flavus) and aflatoxin mycotoxin accumulation in stored feed grain. Details how moisture levels exceeding 15% in storage trigger rapid toxin production, organ damage, immunosuppression, and feed refusal in livestock, establishing critical grain drying thresholds (<15% moisture) to halt mold growth.
      vetting:
        - date: "2026-09-17"
          type: "empirical literature verification"
          author: "Gemini 3.8 Flash (Antigravity)"
          summary: "Rigorous extension research establishing safe grain storage moisture thresholds, mycotoxin toxicogenesis in livestock feeds, and storage mitigation methods."
    - type: historical_manual
      title: "The Wheelwright's Shop"
      author: "Sturt, G."
      year: 1923
      doi_or_url: "https://archive.org/details/wheelwrightsshop00stur"
      local_archive: "sources/verisimilitude/sturt-1923-the-wheelwrights-shop.pdf"
      epistemic_grade: "historical_manual"
      description: >
        Foundational technical treatise on the engineering, timber mechanics, and repair of traditional horse-drawn wagons and carriages. Details bottom-timber structural dynamics, selection of seasoned hardwood (beech, ash, oak) for axle-beds and axle-trees to resist vertical shear and dynamic bending moments from rut shock, iron axle-tree bedding, and traditional wheelwright replacement methods.
      vetting:
        - date: "2026-09-17"
          type: "empirical literature verification"
          author: "Gemini 3.8 Flash (Antigravity)"
          summary: "Definitive historical treatise on carriage axle wood mechanics, shock loading failure modes, and field-to-workshop replacement protocols."
    - type: extension_bulletin
      title: "Cyanobacteria Poisoning (Blue-Green Algae)"
      author: "Meehan, M., Stokka, G., & Mostrom, M."
      year: 2021
      doi_or_url: "https://www.ndsu.edu/agriculture/extension/publications/cyanobacteria-poisoning-blue-green-algae"
      local_archive: "sources/verisimilitude/ndsu-extension-2021-cyanobacteria-poisoning.md"
      epistemic_grade: "primary_academic"
      publication: "North Dakota State University Extension"
      description: >
        Veterinary toxicology bulletin detailing acute livestock poisoning from cyanobacterial blooms (Microcystis, Anabaena, Dolichospermum) in stagnant water bodies. Quantifies lethal doses (as little as 1 quart / ~1 liter of wind-concentrated surface scum fatal to large livestock), rapid neurotoxicity onset within 5–20 minutes (tremors, ataxia, respiratory arrest), acute hepatotoxicity (intrahepatic hemorrhage, liver failure within hours/days), and high mortality rates.
      vetting:
        - date: "2026-09-17"
          type: "empirical literature verification"
