version: "0.5"
log_location: ./scratch/logs/process-compose.log

processes:
  server:
    command: runghc scripts/Watch.hs server
    environment:
      - PORT=3004
    is_restart: true
    shutdown:
      signal: 2
      parent_only: false
      timeout_seconds: 5
    availability:
      restart: "on_failure"
    ready_log_line: "Starting CardPG Server on port 3004"

  client:
    # We use ghciwatch via script for logic reuse and robust restarting
    command: runghc scripts/Watch.hs client
    depends_on:
      server:
        condition: process_log_ready
      tailwind-reflex:
        condition: process_started
    is_restart: false
    is_tty: true
    shutdown:
      signal: 2
      parent_only: false
      timeout_seconds: 5

  tailwind-reflex:
    command: ./node_modules/.bin/tailwindcss -i ./styles/input.css -o ./static/output.css --watch=always
    working_dir: client-reflex
    is_restart: true
    shutdown:
      signal: 15
