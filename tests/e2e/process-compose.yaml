# Port configuration: see config.ts for documentation
# Ports used: 3000 (Caddy/app), 3001 (backend server)
version: "0.5"
log_location: ./scratch/logs/e2e-test.log

processes:
  server:
    command: cabal run exe:server
    environment:
      - PORT=3001
      - CARDPG_USE_IN_MEMORY_DB=true
      - CARDPG_SEED=123
    shutdown:
      signal: 2
      parent_only: false
      timeout_seconds: 5
    availability:
      restart: "no"
      exit_on_end: true
    ready_log_line: "Starting CardPG Server on port 3001"

  caddy:
    command: caddy run
    depends_on:
      server:
        condition: process_log_ready
    shutdown:
      signal: 15
      timeout_seconds: 5
    availability:
      restart: "no"
      exit_on_end: true
    readiness_probe:
      http_get:
        host: 127.0.0.1
        port: 3000
        path: /
      initial_delay_seconds: 1
      period_seconds: 1
      timeout_seconds: 2
      failure_threshold: 10

  playwright:
    command: bash -c "cd tests/e2e && playwright test $PLAYWRIGHT_ARGS"
    depends_on:
      caddy:
        condition: process_healthy
    availability:
      restart: "no"
      exit_on_end: true
    # Exit the whole compose when tests finish
    is_tty: true
