# Weeder configuration
# https://github.com/ocharles/weeder

# Entry points for the project
roots = [
  # Main executables
  "^Main.main$",
  "^ClientMain.main$",
  "server:exe:server",
  "server:exe:server-devel",
  "client:exe:client",
  "client:exe:cardpg-static",

  # Tests are entry points
  "core:test:core-test",
  "server:test:server-test",
  "client:test:client-test",

  # Library Public APIs (protect core and api layers)
  "^Core\\..*$",
  "^Api\\..*$",
  "^Reflex\\.AtomicCss\\..*$",

  # Development and Testing helper patterns
  "^Frontend\\.Devel\\..*$",
  "\\.prop_[a-zA-Z0-9_]+$",

  # Style and design system vocabularies
  "^Frontend\\.Style\\..*$"
]

type-class-roots = true
